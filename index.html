      <div class="vr-field"><label for="vr12-harm">Harm or impact</label><select id="vr12-harm">${[['','Select impact'],['none','No harm identified'],['harm','Harm identified'],['near_miss','Near miss / potential harm'],['unknown','Not known yet']].map(([id,name])=>`<option value="${id}"${v.harm===id?' selected':''}>${name}</option>`).join('')}</select></div>
    </div>
    <div class="vr-field"><label for="vr12-safety">Immediate safety response</label><select id="vr12-safety">${[['','Choose response assessment'],['addressed','Response confirmed; no immediate concern identified'],['followup','Additional safety response is needed'],['unknown','Unable to confirm yet']].map(([id,name])=>`<option value="${id}"${v.safety===id?' selected':''}>${name}</option>`).join('')}</select></div>
    ${(v.severity||r.form.severity)!==r.form.severity?`<div class="vr-field"><label for="vr12-reason">Reason for changing severity</label><textarea id="vr12-reason" rows="2">${esc(v.severityReason||'')}</textarea></div>`:'<div class="vr-field" id="vr12-reason-wrap" hidden><label for="vr12-reason">Reason for changing severity</label><textarea id="vr12-reason" rows="2"></textarea></div>'}
    <div class="vr-field"><label for="vr12-sufficient">Is there enough information to make a decision?</label><select id="vr12-sufficient">${[['','Choose'],['yes','Yes'],['no','No — request clarification']].map(([id,name])=>`<option value="${id}"${v.sufficient===id?' selected':''}>${name}</option>`).join('')}</select></div>
    <div class="vr-field"><label for="vr12-notes">Assessment and findings</label><textarea id="vr12-notes" rows="5" placeholder="State what is known, what is uncertain, and your decision rationale.">${esc(v.notes||r.vrAssessment||'')}</textarea></div>
    <div class="vr-review-actions"><button class="btn" type="button" data-v12="save">Save assessment</button><button class="btn primary" type="button" data-v12="decide">${requiresApproval?'Approve findings':'Acknowledge review'}</button></div>
    <hr class="hr"><div class="vr-field"><label for="vr-question">Question for reporter</label><textarea id="vr-question" placeholder="What additional fact do you need?"></textarea></div><button class="btn" type="button" data-vr="clarify">Request clarification</button>`;
}
function vr12ActionRows(r){
  const actions=r.vrMvp?.actions||[];
  return `<section class="vr-panel"><div class="vr-panelhead"><h2>Follow-up actions</h2><span class="pill outline">${actions.length}</span></div><div class="vr-panelbody">${actions.map((a,i)=>`<div class="vr-section"><strong>${esc(a.title)}</strong><p>Owner: ${esc(a.owner)} · Due: ${esc(a.due||'Not set')} · ${a.done?'Completed':'Open'}</p>${!a.done?`<button class="btn small" type="button" data-v12="action-done" data-index="${i}">Mark completed (demo)</button>`:''}</div>`).join('')||'<p class="vr-muted">No follow-up actions recorded.</p>'}${r.acceptedAt&&r.status!=='closed'?`<div class="vr-p0-grid"><div class="vr-field"><label for="vr12-action-title">Action</label><input id="vr12-action-title" placeholder="Specific follow-up"></div><div class="vr-field"><label for="vr12-action-owner">Responsible team/person</label><input id="vr12-action-owner" placeholder="Owner"></div></div><div class="vr-field"><label for="vr12-action-due">Due date</label><input id="vr12-action-due" type="date"></div><button class="btn" type="button" data-v12="add-action">Add action</button>`:''}</div></section>`;
}
vrQueue=function(){
  const list=vrList().filter(r=>(vr.filter==='all'||vr.filter===vrStage(r))&&[r.id,vrNames(r),r.form.description,rShortClass(r.form)].join(' ').toLowerCase().includes(vr.search.toLowerCase()));
  list.sort((a,b)=>Number(b.form.urgency==='yes')-Number(a.form.urgency==='yes')||(Number(!a.reviewCompletedAt&&new Date(a.reviewDue)<rNow())-Number(!b.reviewCompletedAt&&new Date(b.reviewDue)<rNow()))*-1||(new Date(a.reviewDue)-new Date(b.reviewDue)));
  return `<div class="vr-head"><h1>Incident reviews</h1><span class="pill outline">${esc(RLOCATION.name)}</span></div><div class="vr-tools"><input id="vr-search" type="search" value="${esc(vr.search)}" placeholder="Search incidents or affected person" aria-label="Search reviews"><select id="vr-filter" aria-label="Filter reviews">${[['all','All tasks'],['new','Awaiting acceptance'],['review','In review'],['complete','Review completed'],['closed','Closed']].map(([id,name])=>`<option value="${id}"${vr.filter===id?' selected':''}>${name}</option>`).join('')}</select><span class="vr-count">${list.length} cases</span></div><div class="vr-panel" style="overflow-x:auto"><table class="vr-table vr-queue-table"><thead><tr><th>Incident</th><th>Affected by</th><th>Location</th><th>Severity / urgent</th><th>Review task</th><th>Due</th><th></th></tr></thead><tbody>${list.map(r=>`<tr><td><strong>${esc(r.id)}</strong><small>${esc(rShortClass(r.form))}</small></td><td>${esc(vrNames(r))}</td><td>${esc(r.location)}${r.form.place?' · '+esc(r.form.place):''}</td><td><div class="vr-priority">${esc(levelName(r.form.severity)||'Unassessed')}${r.form.urgency==='yes'?'<span class="mk s-danger">Urgent</span>':r.form.urgency==='unknown'?'<span class="mk s-warn">Urgency unsure</span>':''}</div></td><td>${esc(vr12Status(r))}<small>${esc(groupName(r.flow?.group)||'Reviewer group')}</small></td><td>${vr12Due(r)}</td><td><button class="textbtn" type="button" data-vr="open" data-id="${esc(r.id)}">Open</button></td></tr>`).join('')||'<tr><td colspan="7">No matching reviews.</td></tr>'}</tbody></table></div>`;
};
vrDetail=function(){
  const r=rState.reports.find(x=>x.id===vr.detailId);if(!r){vr.detailId=null;return vrQueue()}
  const f=r.form,v=r.vrMvp||{},step=vr12Step(r),outstanding=r.clarifications.filter(q=>q.status==='outstanding');
  const ended=Boolean(r.reviewCompletedAt),secondPending=ended&&Boolean(step.second)&&!v.secondDone;
  return `<div class="vr-head"><div><button class="textbtn back" data-vr="back">← Incident reviews</button><h1>${esc(r.id)} · ${esc(rShortClass(f))}</h1><p>${esc(r.location)} · Reported ${esc(rFmt(r.submittedAt))}</p></div><div class="vr-priority"><span class="pill ${f.urgency==='yes'?'red':'outline'}">${f.urgency==='yes'?'Urgent':f.urgency==='unknown'?'Urgency unknown':'Not urgent'}</span><span class="pill outline">${esc(vr12Status(r))}</span></div></div><div class="vr-detail"><div>
  <section class="vr-panel"><div class="vr-panelhead"><h2>Original incident report</h2><span class="pill outline">Read-only</span></div><div class="vr-panelbody"><div class="vr-facts"><div class="vr-fact"><small>Affected by</small><strong>${esc(vrNames(r))}</strong></div><div class="vr-fact"><small>Location</small><strong>${esc(r.location)}${f.place?' · '+esc(f.place):''}</strong></div><div class="vr-fact"><small>Occurred</small><strong>${esc(rDisplayEvent(f))}</strong></div><div class="vr-fact"><small>Reported severity</small><strong>${esc(levelName(f.severity)||'Not assessed')}</strong></div><div class="vr-fact"><small>Injury</small><strong>${esc(f.injury||'Unknown')}</strong></div><div class="vr-fact"><small>Immediate response</small><strong>${esc(f.response||'Not known')}</strong></div></div><div class="vr-section"><h3>What happened?</h3><p class="vr-narrative">${esc(f.description)}</p></div>${f.injuryDetails?`<div class="vr-section"><h3>Injury details</h3><p>${esc(f.injuryDetails)}</p></div>`:''}${f.responseDetails?`<div class="vr-section"><h3>Response details</h3><p>${esc(f.responseDetails)}</p></div>`:''}<div class="vr-section"><h3>Reporter attachments</h3><div class="vr-attachments">${(f.attachments||[]).map(a=>`<span class="vr-attachment">${esc(a.name||'Attachment')} · ${esc(a.sizeLabel||'File metadata')}</span>`).join('')||'<span class="vr-muted">No attachments submitted.</span>'}</div></div></div></section>
  <section class="vr-panel"><div class="vr-panelhead"><h2>Clarifications</h2><span class="pill outline">${outstanding.length} waiting</span></div><div class="vr-panelbody">${r.clarifications.map(q=>`<div class="vr-clarification"><strong>${esc(q.question)}</strong><p>${q.status==='answered'?'Reporter: '+esc(q.response):'Awaiting reporter response'}</p><small>${esc(q.status)}</small></div>`).join('')||'<p class="vr-muted">No clarification requests.</p>'}</div></section>
  ${vr12ActionRows(r)}
  <section class="vr-panel"><div class="vr-panelhead"><h2>Activity history</h2></div><div class="vr-panelbody">${(r.timeline||[]).slice().reverse().map(e=>`<p style="margin-bottom:11px">${esc(e.text)}<small style="display:block">${esc(rFmt(e.at))}</small></p>`).join('')||'<p class="vr-muted">No activity.</p>'}</div></section></div>
  <aside><section class="vr-panel"><div class="vr-panelhead"><h2>Your review</h2></div><div class="vr-panelbody"><div class="vr-taskstatus"><strong>${esc(vr12Status(r))}</strong><small>${esc(groupName(r.flow?.group)||'Reviewer group')}</small><small>Due: ${vr12Due(r)}</small></div>
  ${!r.acceptedAt?`<button class="btn primary" type="button" data-vr="accept">Accept review</button>`:!ended?vr12ReviewFields(r):`<div class="vr-p0-notice vr-p0-success"><strong>${step.first.response==='acknowledgment'?'Acknowledgment recorded':'First review approved'}</strong><br>${esc(rFmt(r.reviewCompletedAt))}${v.signature?` · Confirmation recorded by ${esc(v.signature)}`:''}. Incident remains open.</div><div class="vr-review-summary"><span><strong>Severity:</strong> ${esc(levelName(v.severity)||'Not recorded')}</span><span><strong>Impact:</strong> ${esc(v.harm||'Not recorded')}</span><span><strong>Safety:</strong> ${esc(v.safety||'Not recorded')}</span><p>${esc(v.notes||r.vrAssessment||'')}</p></div>${secondPending?`<div class="vr-p0-notice">Second review is required: ${esc(groupName(step.second.group)||'Configured reviewer team')}.</div><button type="button" class="btn primary" data-v12="second-accept">Complete independent second review (demo)</button>`:v.secondDone?'<span class="pill green">Second review completed</span>':''}`}
  ${outstanding.length?`<div class="vr-p0-notice">${outstanding.length} clarification request${outstanding.length===1?'':'s'} outstanding.</div>`:''}</div></section></aside></div>`;
};
document.addEventListener('change',e=>{if(e.target.id==='vr12-severity'){const wrap=document.getElementById('vr12-reason-wrap');if(wrap)wrap.hidden=e.target.value===(rState.reports.find(r=>r.id===vr.detailId)?.form.severity||'')}});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-v12]');if(!b)return;
  const r=rState.reports.find(x=>x.id===vr.detailId);if(!r)return;
  const v=r.vrMvp||(r.vrMvp={});const action=b.dataset.v12;
  if(action==='save'||action==='decide'){
    const severity=$('#vr12-severity')?.value,harm=$('#vr12-harm')?.value,safety=$('#vr12-safety')?.value,sufficient=$('#vr12-sufficient')?.value,notes=$('#vr12-notes')?.value.trim(),reason=$('#vr12-reason')?.value.trim();
    if(!severity||!harm||!safety||!sufficient||!notes){toast('Complete severity, impact, safety, information sufficiency and findings.',true);return}
    if(severity!==r.form.severity&&!reason){toast('Explain the change in severity.',true);return}
    Object.assign(v,{severity,harm,safety,sufficient,notes,severityReason:reason});r.vrAssessment=notes;
    if(action==='decide'){
      if(sufficient!=='yes'){toast('Request the missing information before making a decision.',true);return}
      if(safety==='followup'&&!(v.actions||[]).length){toast('Record a follow-up action for the unresolved safety response.',true);return}
      if(r.clarifications.some(q=>q.status==='outstanding')){toast('Clarification is still outstanding.',true);return}
      const first=vr12Step(r).first;
      if(first.signature){const accepted=confirm('Demo only: confirm your recorded review decision as Morgan Davis. This is not an electronic signature.');if(!accepted)return;v.signature='Morgan Davis';v.signatureAt=rIso(rNow())}
      v.decision=first.response==='acknowledgment'?'acknowledged':'approved';r.reviewCompletedAt=rIso(rNow());rLog(r,`First review ${v.decision} by Morgan Davis. Assessment stored separately from original report.`);
    }else rLog(r,'Structured reviewer assessment saved by Morgan Davis.');
    rPersist();render();toast(action==='save'?'Assessment saved.':'Review decision recorded; incident remains open.');return;
  }
  if(action==='add-action'){
    const title=$('#vr12-action-title')?.value.trim(),owner=$('#vr12-action-owner')?.value.trim(),due=$('#vr12-action-due')?.value;
    if(!title||!owner||!due){toast('Enter an action, owner and due date.',true);return}
    (v.actions||(v.actions=[])).push({title,owner,due,done:false});rLog(r,`Follow-up action assigned to ${owner}: ${title}`);
  }else if(action==='action-done'){
    const item=v.actions?.[Number(b.dataset.index)];if(!item)return;
    item.done=true;rLog(r,`Follow-up action marked completed in demo: ${item.title}. No effectiveness verification implied.`);
  }else if(action==='second-accept'){
    const second=vr12Step(r).second;
    if(!second)return;
    const name=prompt('Independent second reviewer name (cannot be Morgan Davis):');if(!name)return;
    if(name.trim().toLowerCase()==='morgan davis'){toast('Second review requires a different person.',true);return}
    if(second.signature&&!confirm('Demo confirmation only. No production e-signature is created.'))return;
    v.secondDone=rIso(rNow());v.secondReviewer=name.trim();rLog(r,`Independent second review recorded in demo by ${name.trim()}. Case remains open.`);
  }
  rPersist();render();toast('Changes saved.');
});

<script data-bundled-from="reporter-v13.js">
/* Reporter v1.3: leaner copy and controls without changing the incident data model. */
const r13PageSize=4;
rUI.reportPage=1;

function r13Rows(){
  let records=rOwn().map(r=>({kind:'report',r}));
  if(rUI.reportFilter==='drafts')records=rState.drafts.map(d=>({kind:'draft',d}));
  else{
    if(rUI.reportFilter==='response')records=records.filter(x=>x.r.clarifications.some(q=>q.status==='outstanding'));
    if(rUI.reportFilter==='overdue')records=records.filter(x=>rIsOverdue(x.r));
    if(rUI.reportFilter==='escalations')records=records.filter(x=>rOpenEsc(x.r));
    if(rUI.reportFilter==='recent')records=records.filter(x=>new Date(x.r.submittedAt)>=rNow()-30*86400000||x.r.clarifications.some(q=>q.status==='outstanding')||rOpenEsc(x.r));
    if(rUI.reportFilter==='all')records.push(...rState.drafts.map(d=>({kind:'draft',d})));
  }
  records.sort((a,b)=>new Date(b.r?.submittedAt||b.d.savedAt)-new Date(a.r?.submittedAt||a.d.savedAt));
  const q=rUI.search.toLowerCase();
  return records.filter(x=>{const f=x.r?.form||x.d.form;return [(x.r?.id||x.d.id),rNames(f),f.patients.some(pid=>!rCanPatient(pid))?'':rShortClass(f)].join(' ').toLowerCase().includes(q)});
}

rReportRow=function(x){
  if(x.kind==='draft'){
    const d=x.d,restricted=d.form.patients.some(pid=>!rCanPatient(pid));
    return `<tr data-r="continue-draft" data-id="${esc(d.id)}"><td><strong class="tx mono">${esc(d.id)}</strong></td><td><strong class="tx">${esc(rNames(d.form))}</strong></td><td><span class="tx">${esc(restricted?'Incident details restricted':rShortClass(d.form))}</span></td><td><span class="tx">${esc(rFmt(d.savedAt))}</span></td><td class="r-status-cell"><span class="mk s-none">Draft</span></td><td><span class="mk s-info">Continue draft</span></td><td class="r"><button class="chev" type="button" data-r="continue-draft" data-id="${esc(d.id)}" aria-label="Continue draft ${esc(d.id)}">${icon('chevron',18)}</button></td></tr>`;
  }
  const r=x.r,status=r.status==='closed'?'s-ok':r.status==='under_review'?'s-info':'s-none';
  return `<tr data-r="view-report" data-id="${esc(r.id)}"><td><strong class="tx mono">${esc(r.id)}</strong></td><td><strong class="tx">${esc(rNames(r.form))}</strong></td><td><span class="tx">${esc(rHasHidden(r)?'Incident details restricted':rShortClass(r.form))}</span></td><td><span class="tx">${esc(rFmt(r.submittedAt))}</span></td><td class="r-status-cell"><span class="mk ${status}">${esc(rStatus(r))}</span></td><td>${rNext(r)}</td><td class="r"><button class="chev" type="button" data-r="view-report" data-id="${esc(r.id)}" aria-label="Open ${esc(r.id)}">${icon('chevron',18)}</button></td></tr>`;
};

rReportsTab=function(){
  const records=r13Rows(),total=records.length,pages=Math.max(1,Math.ceil(total/r13PageSize));
  rUI.reportPage=Math.min(Math.max(1,rUI.reportPage||1),pages);
  const start=(rUI.reportPage-1)*r13PageSize,shown=records.slice(start,start+r13PageSize);
  const counts=rCounts(),tabs=[['all','All reports'],['response','Needs response'],['drafts','Drafts'],['recent','Recently submitted'],['overdue','Overdue'],['escalations','Escalations']];
  return `<nav class="r-report-tabs" aria-label="Filter my reports">${tabs.map(([v,n])=>`<button type="button" data-r="widget" data-filter="${v}" class="${rUI.reportFilter===v?'active':''}" aria-current="${rUI.reportFilter===v?'page':'false'}">${n}<span class="count">${Number(counts[v]||0)}</span></button>`).join('')}</nav>
    <div class="r-report-toolbar"><div class="search">${icon('search',16)}<input type="search" id="r-search" placeholder="Search incident ID, person or type" value="${esc(rUI.search)}" aria-label="Search my reports" data-r-search="reports"></div><span class="tiny muted">${total} ${total===1?'record':'records'}</span></div>
    ${total?`<div class="tablewrap"><table class="r-table"><colgroup><col style="width:15%"><col style="width:22%"><col style="width:17%"><col style="width:16%"><col style="width:12%"><col><col style="width:48px"></colgroup><thead><tr><th scope="col">ID</th><th scope="col">Affected by</th><th scope="col">Classification</th><th scope="col">Date</th><th scope="col">Status</th><th scope="col">Next step</th><th scope="col" class="r"><span class="sr-only">Open</span></th></tr></thead><tbody>${shown.map(rReportRow).join('')}</tbody></table></div>`:rEmpty('Change the filter or start a report.','No matching reports')}
    <div class="r-paging"><span>${total?start+1:0}–${Math.min(start+r13PageSize,total)} of ${total}</span><button type="button" data-reporter-page="previous" ${rUI.reportPage===1?'disabled':''}>Previous</button><span>Page ${rUI.reportPage} of ${pages}</span><button type="button" data-reporter-page="next" ${rUI.reportPage===pages?'disabled':''}>Next</button></div>`;
};

const r13HomeBase=rHome;
rHome=function(){return r13HomeBase()
  .replace('Replying keeps the original deadline and links your answer to the report.','')
  .replace(/<span class="r-tabhint">[\s\S]*?<\/span>/,'')
  .replace(/<p class="tiny muted" style="margin-top:16px"><\/p>/,'');};

const r13SearchBase=rPersonSearch;
rPersonSearch=function(kind){
  if(!['patient','employee'].includes(kind))return r13SearchBase(kind);
  const values=rUI.form?.[kind==='patient'?'patients':'employees']||[];
  const chips=values.map(v=>{
    const name=kind==='patient'?(rCanPatient(v)?rPatient(v)?.name:'Patient details restricted'):(EMPLOYEES.find(e=>e.id===v)?.name||'Employee');
    return `<span class="r-chip">${esc(name)}<button type="button" data-r="remove-person" data-kind="${kind}" data-id="${esc(v)}" aria-label="Remove ${esc(name)}">${icon('close',11)}</button></span>`;
  }).join('');
  return `<div class="r-searchwrap"><div class="r-person-combobox">${chips}<input type="search" id="r-${kind}-search" placeholder="${values.length?'Add another person…':'Search by name or ID'}" aria-label="Search ${kind}" aria-controls="r-${kind}-results" aria-expanded="false" autocomplete="off" data-person-search="${kind}"></div><div class="r-results" id="r-${kind}-results" hidden></div></div>`;
};
const r13ChipsBase=rPersonChips;
rPersonChips=function(kind,values){return kind==='patient'||kind==='employee'?'':r13ChipsBase(kind,values)};

const r13FormBase=rFormView;
rFormView=function(){
  let html=r13FormBase();
  html=html.replace(/<div class="r-contextbar">[\s\S]*?<\/strong><\/div><\/div>/,'');
  html=html.replace(/<div class="note amber">[\s\S]*?Do not delay immediate care or emergency procedures to complete this form\.<\/strong><br><\/div><\/div>/,'');
  html=html.replace(/<span class="rank">\d+<\/span>/g,'');
  html=html.replace('<p>Report what you know.</p>','');
  html=html.replace(/<div class="r-checks">([\s\S]*?)<\/div><div class="r-exclusive"><span>Or<\/span>([\s\S]*?)<\/div>/,(_,checks,alternatives)=>`<div class="r-affected-options">${checks}</div><div class="r-affected-divider">Or</div><div class="r-affected-alternatives">${alternatives}</div>`);
  html=html.replace(/<div class="r-field"><label>Actions taken · select any that apply<\/label><div class="r-checks">([\s\S]*?)<\/div><small><\/small><\/div>/,(_,choices)=>{
    const count=rUI.form?.tags?.length||0;
    return `<div class="r-field"><label>Actions taken</label><details class="r-action-multi"><summary><span data-action-summary>${count?`${count} action${count===1?'':'s'} selected`:'Select actions taken'}</span>${icon('down',15)}</summary><div class="r-action-options">${choices}</div></details></div>`;
  });
  html=html.replace(/<footer class="r-formfooter">[\s\S]*?<\/footer>/,`<footer class="r-formfooter"><span></span><div class="actions"><button type="button" class="btn" data-r="home">Cancel</button><button type="button" class="btn" data-r="save-report-draft">Save as draft</button><button type="button" class="btn primary" data-r="review-report">Submit</button></div></footer>`);
  html=html.replace(/<small class="r-helper"><\/small>/g,'').replace(/<p class="r-helper"[^>]*><\/p>/g,'').replace(/<small><\/small>/g,'');
  html=html.replace('Select all that apply.','').replace('Search and add patients.','').replace('Describe what was actually done.','').replace('Leave unknown date or time blank.','');
  return html;
};

const r13DrawerBase=rpDrawerContents;
rpDrawerContents=function(){return r13DrawerBase().replace(/(<div class="rp-drawerhead"><div><h2>[\s\S]*?<\/h2>)<p>[\s\S]*?<\/p>/,'$1')};

const r13RenderBase=render;
render=function(){
  const active=ui.workspace==='reporter'&&rUI.view==='form'?document.activeElement:null;
  const scroller=document.querySelector('.rp-drawerbody');
  const savedScroll=scroller?.scrollTop,focusId=active?.id||'',focusSearch=active?.dataset?.personSearch||'',selection=active&&['INPUT','TEXTAREA'].includes(active.tagName)&&typeof active.selectionStart==='number'?active.selectionStart:null;
  r13RenderBase();
  if(ui.workspace==='reporter'&&rUI.view==='form'&&Number.isFinite(savedScroll)){
    const after=document.querySelector('.rp-drawerbody');if(after)after.scrollTop=savedScroll;
    if(focusId){const el=document.getElementById(focusId);if(el){el.focus({preventScroll:true});if(selection!==null&&el.setSelectionRange)try{el.setSelectionRange(selection,selection)}catch(_){}}}
    else if(focusSearch){document.querySelector(`[data-person-search="${focusSearch}"]`)?.focus({preventScroll:true})}
  }
};

document.addEventListener('click',event=>{
  const pagination=event.target.closest('[data-reporter-page]');
  if(pagination){rUI.reportPage+=pagination.dataset.reporterPage==='next'?1:-1;render();return}
  if(event.target.closest('[data-r="widget"],[data-r="tab"]'))rUI.reportPage=1;
  if(event.target.closest('[data-r="select-person"]')){
    const kind=event.target.closest('[data-r="select-person"]').dataset.kind;
    queueMicrotask(()=>document.querySelector(`[data-person-search="${kind}"]`)?.focus({preventScroll:true}));
  }
},true);
document.addEventListener('change',event=>{
  if(event.target.matches('[data-response-tag]')){
    queueMicrotask(()=>{const summary=document.querySelector('[data-action-summary]');if(summary){const count=rUI.form?.tags?.length||0;summary.textContent=count?`${count} action${count===1?'':'s'} selected`:'Select actions taken'}});
  }
},false);
document.addEventListener('input',event=>{if(event.target.matches('[data-r-search="reports"]'))rUI.reportPage=1},true);
render();
document.title='blueEHR · Incident Management Three Roles · v1.7';
const aboutControl=document.querySelector('[data-act="about"]');if(aboutControl)aboutControl.textContent='About prototype';

</script>

<script data-bundled-from="reviewer-v14.js">
/* Reviewer queue and detail navigation; retains all v12 P0 review actions. */
vr.page = vr.page || 1;
vr.pageSize = vr.pageSize || 10;
const vr14OldRender = vrRender;
const vr14DetailContent = vrDetail;
function vr14Stage(r){return vrStage(r)}
function vr14Badge(r){
  const state=vr14Stage(r), label=state==='new'?'Awaiting acceptance':state==='review'?'In review':state==='complete'?'Completed':'Closed';
  return `<span class="vr14-status vr14-${state}">${label}</span>`;
}
function vr14Urgency(f){return f.urgency==='yes'?'<span class="vr14-priority urgent">Urgent</span>':f.urgency==='unknown'?'<span class="vr14-priority unknown">Unknown</span>':'No'}
vrQueue=function(){
  const all=vrList();
  const tabs=[['all','All'],['new','Awaiting acceptance'],['review','In review'],['complete','Completed'],['closed','Closed']];
  const search=vr.search.trim().toLowerCase();
  const matched=all.filter(r=>[r.id,vrNames(r),r.form.description,rShortClass(r.form),r.reporterName,r.location].join(' ').toLowerCase().includes(search));
  const counts=Object.fromEntries(tabs.map(([key])=>[key,key==='all'?matched.length:matched.filter(r=>vr14Stage(r)===key).length]));
  const results=matched.filter(r=>vr.filter==='all'||vr14Stage(r)===vr.filter);
  results.sort((a,b)=>Number(b.form.urgency==='yes')-Number(a.form.urgency==='yes')||new Date(a.reviewDue||a.submittedAt)-new Date(b.reviewDue||b.submittedAt));
  const pages=Math.max(1,Math.ceil(results.length/vr.pageSize));vr.page=Math.max(1,Math.min(vr.page,pages));
  const shown=results.slice((vr.page-1)*vr.pageSize,vr.page*vr.pageSize);
  return `<nav class="vr14-tabs" aria-label="Review status">${tabs.map(([key,title])=>`<button type="button" class="vr14-tab ${vr.filter===key?'active':''}" data-vr14="tab" data-tab="${key}" aria-current="${vr.filter===key?'page':'false'}">${title} <span>(${counts[key]})</span></button>`).join('')}</nav>
   <div class="vr14-searchrow"><input id="vr-search" type="search" value="${esc(vr.search)}" placeholder="Search by ID, person, classification or location" aria-label="Search reviews"><span>${results.length} result${results.length===1?'':'s'}</span></div>
   <div class="vr-panel vr14-tablewrap"><table class="vr-table vr14-table"><thead><tr><th>ID</th><th>Affected by</th><th>Incident classification</th><th>Severity</th><th>Urgency</th><th>Submitted on</th><th>Submitted by</th><th>Status</th><th>Location</th><th>Due</th></tr></thead><tbody>${shown.map(r=>`<tr class="vr14-row" data-vr="open" data-id="${esc(r.id)}" tabindex="0" role="button" aria-label="Open review ${esc(r.id)}"><td><strong>${esc(r.id)}</strong></td><td>${esc(vrNames(r))}</td><td>${esc(rShortClass(r.form))}</td><td>${esc(levelName(r.form.severity)||'Unassessed')}</td><td>${vr14Urgency(r.form)}</td><td>${esc(rFmt(r.submittedAt))}</td><td>${esc(r.reporterName||'Unknown')}</td><td>${vr14Badge(r)}</td><td>${esc(r.location||'Not specified')}</td><td>${vr12Due(r)}</td></tr>`).join('')||'<tr><td colspan="10" class="vr14-empty">No matching reviews</td></tr>'}</tbody></table></div>
   <div class="vr14-pagination"><span>${results.length?`${(vr.page-1)*vr.pageSize+1}–${Math.min(results.length,vr.page*vr.pageSize)} of ${results.length}`:'0 results'}</span><div><label for="vr14-size">Rows per page</label><select id="vr14-size" aria-label="Rows per page">${[10,25,50].map(n=>`<option value="${n}"${vr.pageSize===n?' selected':''}>${n}</option>`).join('')}</select><button type="button" data-vr14="previous" ${vr.page===1?'disabled':''}>Previous</button><span>Page ${vr.page} of ${pages}</span><button type="button" data-vr14="next" ${vr.page===pages?'disabled':''}>Next</button></div></div>`;
};
vrRender=function(){
  vr14OldRender();
  const content=$('#content');
  content.innerHTML=`<div class="vr-main vr14-main">${vrQueue()}</div>`;
  $('#band').innerHTML='<div class="band-l"><span class="band-t">Incident Review</span></div>';
  $('#wsbar').innerHTML='';
  document.getElementById('vr14-overlay')?.remove();
  if(vr.detailId){
    const wrap=document.createElement('div');wrap.id='vr14-overlay';wrap.className='vr14-overlay';
    const r=rState.reports.find(x=>x.id===vr.detailId);
    wrap.innerHTML=`<div class="vr14-shade" data-vr14="close"></div><section class="vr14-drawer" role="dialog" aria-modal="true" aria-label="Incident review ${esc(vr.detailId)}"><div class="vr14-drawerbar"><div><strong>${esc(vr.detailId)}</strong><span>${r?esc(rShortClass(r.form)):''}</span></div><button type="button" data-vr14="close" aria-label="Close review">×</button></div><div class="vr14-drawerbody">${vrDetail()}</div></section>`;
    document.body.appendChild(wrap);
    const back=wrap.querySelector('[data-vr="back"]');back?.remove();
    wrap.querySelector('.vr-head')?.remove();
    vr14Snapshot=vr14GetInputs();
  }
};
let vr14Snapshot='';
function vr14GetInputs(){const drawer=document.querySelector('.vr14-drawer');return drawer?[...drawer.querySelectorAll('textarea,input:not([type="hidden"]),select')].map(el=>`${el.id}:${el.value}`).join('|'):''}
function vr14Close(){
  if(vr14Snapshot!==vr14GetInputs()&&!confirm('Discard unsaved review changes?'))return;
  vr.detailId=null;render();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-vr14]');if(!b)return;
  const action=b.dataset.vr14;
  if(action==='tab'){vr.filter=b.dataset.tab;vr.page=1;render()}
  if(action==='previous'){vr.page=Math.max(1,vr.page-1);render()}
  if(action==='next'){vr.page++;render()}
  if(action==='close')vr14Close();
});
document.addEventListener('change',e=>{if(e.target.id==='vr14-size'){vr.pageSize=Number(e.target.value);vr.page=1;render()}});
document.addEventListener('keydown',e=>{
  if(ui.workspace!=='reviewer')return;
  if(e.key==='Escape'&&vr.detailId){e.preventDefault();vr14Close();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.vr14-row')){e.preventDefault();e.target.click()}
});
/* Also remove drawer when changing persona from the top role selector. */
const vr14PriorGlobalRender=render;
render=function(){if(ui.workspace!=='reviewer')document.getElementById('vr14-overlay')?.remove();return vr14PriorGlobalRender()};
if(ui.workspace==='reviewer')render();

</script>

<script data-bundled-from="workspace-v15.js">
/* v15 — present complex configuration clearly; make review a decision task. */
(function(){
  const previousShowModal=showModal;
  showModal=function(kind,title,subtitle,body,footer,opts={}){
    if(['history','list','notification-preview','signature-preview','report-preview'].includes(kind)){
      opts={...opts,center:false};
    }
    return previousShowModal(kind,title,subtitle,body,footer,opts);
  };
  const previousWorkflowList=renderWorkflow;
  renderWorkflow=function(){
    if(ui.workflowId&&wfBy(ui.workflowId))return previousWorkflowList();
    const templateRows=config().workflow.templates.map(w=>{
      const typeText=w.fallback?'Unmatched incidents':w.types.map(t=>typeName(t)).join(', ');
      return `<tr><td><button class="v15-rowlink" type="button" data-act="edit-workflow" data-id="${esc(w.id)}">${esc(w.name)}</button><small>${esc(w.description||'')}</small></td><td>${esc(typeText)}</td><td>${w.combinations.length}</td><td>${statusPill(w.fallback?'Default':w.enabled?'Enabled in draft':'Not enabled',w.fallback?'blue':w.enabled?'green':'')}</td><td>${btn('Configure','edit-workflow','small',`data-id="${w.id}"`)}</td></tr>`;
    }).join('');
    return `<div class="v15-pagebar"><h1>Workflow templates</h1>${btn('New template','new-workflow','primary','','plus')}</div>
      <section class="card v15-workflows"><div class="v15-search"><input type="search" id="v15-workflow-search" placeholder="Search workflow templates" aria-label="Search workflow templates"><span>${config().workflow.templates.length} templates</span></div><div class="tablewrap"><table id="v15-workflow-table"><thead><tr><th>Workflow</th><th>Incident types</th><th>Combinations</th><th>Status</th><th></th></tr></thead><tbody>${templateRows}</tbody></table></div></section>
      <section class="card v15-routing"><div class="cardhead"><h2>Initial routing & urgent alerts</h2>${btn('Configure','routing','small')}</div><div class="cardbody"><div class="grid3"><div><div class="label">Default review group</div><strong>${esc(groupName(config().workflow.fallbackGroup))}</strong></div><div><div class="label">Urgent attention</div><strong>${esc(groupName(config().workflow.urgentGroup))}</strong></div><div><div class="label">Backup group</div><strong>${esc(groupName(config().workflow.backupGroup))}</strong></div></div></div></section>
      <div class="actions">${btn('Run a workflow example','simulate','','','play')}</div>`;
  };
  document.addEventListener('input',e=>{
    if(e.target.id==='v15-workflow-search'){
      const term=e.target.value.trim().toLowerCase();
      document.querySelectorAll('#v15-workflow-table tbody tr').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(term));
    }
  });
  function adminHeader(){
    if(ui.workspace!=='admin')return;
    const pin=document.getElementById('pinbar');if(pin)pin.hidden=true;
    const band=document.querySelector('#band .band-r');if(!band)return;
    if(!band.querySelector('[data-act="save"]')){
      band.insertAdjacentHTML('beforeend',`<button class="btn small" type="button" data-act="save">Save draft</button><button class="btn primary small" type="button" data-act="review-publish">Review & activate</button>`);
    }
  }
  const prevDrawChrome=drawChrome;
  drawChrome=function(){prevDrawChrome();adminHeader()};
  const prevRender=render;
  render=function(){const val=prevRender();adminHeader();return val};
  const prevStepFields=vr12ReviewFields;
  vr12ActionRows=function(r){
    const configured=vr12Step(r).actions||[];
    const recorded=r.vrMvp?.actions||[];
    const tasks=recorded.length?recorded:configured.map(a=>({title:a.title,owner:groupName(a.group)||'Configured owner',due:targetText(slaBy(a.sla)),done:false}));
    if(!tasks.length)return '';
    return `<section class="vr-panel"><div class="vr-panelhead"><h2>Configured follow-up actions</h2></div><div class="vr-panelbody">${tasks.map(a=>`<div class="vr-section"><strong>${esc(a.title)}</strong><p>${esc(a.owner||groupName(a.group)||'Assigned owner')} · ${esc(a.due||targetText(slaBy(a.sla))||'Due by configuration')} · ${a.done?'Completed':'Pending'}</p></div>`).join('')}</div></section>`;
  };
  vr12ReviewFields=function(r){
    const step=vr12Step(r).first;
    const approval=step.response!=='acknowledgment';
    const v=r.vrMvp||{};
    return `<div class="v15-decision"><div class="vr-field"><label for="v15-review-note">Review comments <span class="v15-optional">(optional)</span></label><textarea id="v15-review-note" rows="4" placeholder="Record your decision rationale, if needed.">${esc(v.notes||r.vrAssessment||'')}</textarea></div><div class="v15-reviewoutcome"><span>Required response</span><strong>${approval?'Approval':'Acknowledgment'}</strong>${step.signature?'<span class="v15-sig">Signature required</span>':''}</div><button class="btn primary v15-primary" type="button" data-v15="decision">${approval?'Approve report':'Acknowledge report'}</button><hr class="hr"><div class="vr-field"><label for="vr-question">Request clarification</label><textarea id="vr-question" rows="3" placeholder="Ask the reporter for missing information."></textarea></div><button class="btn" type="button" data-vr="clarify">Send question</button></div>`;
  };
  document.addEventListener('click',e=>{
    const btn=e.target.closest('[data-v15="decision"]');if(!btn)return;
    const r=rState.reports.find(x=>x.id===vr.detailId);if(!r||!r.acceptedAt||r.reviewCompletedAt)return;
    if(r.clarifications.some(q=>q.status==='outstanding')){toast('Wait for the outstanding clarification before completing this review.',true);return}
    const first=vr12Step(r).first;
    const notes=document.getElementById('v15-review-note')?.value.trim()||'';
    const v=r.vrMvp||(r.vrMvp={});
    if(r.reporterId===REPORTER.id){toast('You cannot review an incident you submitted.',true);return}
    if(first.signature){if(!confirm(`Confirm your review decision as ${REPORTER.name} (prototype only; not a legally binding electronic signature).`))return;v.signature=REPORTER.name;v.signatureAt=rIso(rNow())}
    v.notes=notes;v.decision=first.response==='acknowledgment'?'acknowledged':'approved';r.vrAssessment=notes;r.reviewCompletedAt=rIso(rNow());
    rLog(r,`First review ${v.decision} by ${REPORTER.name}. ${vr12Step(r).second?'Second review routed to the configured reviewer group.':'No second review configured.'}`);
    rPersist();render();toast('Review decision recorded. Incident remains open.');
  });
  // Keep the simulation available without making the first reviewer manage the second assignment.
  const priorDetail=vrDetail;
  vrDetail=function(){return priorDetail().replace('Complete independent second review (demo)','Simulate second reviewer decision')};
  if(ui.workspace==='admin')render();
})();

</script>

<script data-bundled-from="workspace-v16.js">
/* Shared incident tables and a single workflow-template configuration drawer. */
(function(){
  const v16Labels=[['ID','ID'],['Affected by','Affected by'],['Incident classification','Incident classification'],['Severity','Severity'],['Urgency','Urgency'],['Submitted on','Submitted on'],['Submitted by','Submitted by'],['Status','Status'],['Location','Location'],['Due','Due']];
  const v16Status=(label,type)=>`<span class="v16-status ${type||'neutral'}">${esc(label)}</span>`;
  const v16Urgency=f=>f.urgency==='yes'?v16Status('Urgent','danger'):f.urgency==='unknown'?v16Status('Unknown','warning'):'No';
  function v16Due(r){const q=(r.clarifications||[]).filter(q=>q.status==='outstanding').sort((a,b)=>new Date(a.dueAt)-new Date(b.dueAt))[0];return q?.dueAt?esc(rFmt(q.dueAt)):'—'}
  rReportRow=function(x){
    const draft=x.kind==='draft',r=x.r,d=x.d,f=draft?d.form:r.form,id=draft?d.id:r.id;
    const restricted=draft?f.patients.some(pid=>!rCanPatient(pid)):rHasHidden(r);
    const status=draft?'Draft':rStatus(r),sclass=draft?'neutral':r.status==='closed'?'success':r.clarifications.some(q=>q.status==='outstanding')?'warning':'info';
    const cells=[`<strong>${esc(id)}</strong>`,esc(rNames(f)),esc(restricted?'Incident details restricted':rShortClass(f)),esc(levelName(f.severity)||'Unassessed'),v16Urgency(f),draft?'—':esc(rFmt(r.submittedAt)),draft?'—':esc(r.reporterName||REPORTER.name),v16Status(status,sclass),esc(draft?(f.location||RLOCATION.name||'—'):(r.location||'—')),draft?'—':v16Due(r)];
    return `<tr class="v16-openrow" role="button" tabindex="0" aria-label="${draft?'Continue draft':'Open incident'} ${esc(id)}" data-r="${draft?'continue-draft':'view-report'}" data-id="${esc(id)}">${cells.map((cell,i)=>`<td${i===0?' class="v16-id"':''}>${cell}</td>`).join('')}</tr>`;
  };
  rReportsTab=function(){
    const records=r13Rows(),total=records.length,pages=Math.max(1,Math.ceil(total/r13PageSize));
    rUI.reportPage=Math.max(1,Math.min(rUI.reportPage||1,pages));
    const start=(rUI.reportPage-1)*r13PageSize,shown=records.slice(start,start+r13PageSize),counts=rCounts();
    const tabs=[['all','All reports'],['response','Needs response'],['drafts','Drafts'],['recent','Recently submitted'],['overdue','Overdue'],['escalations','Escalations']];
    return `<nav class="r-report-tabs v16-tabs" aria-label="Filter my reports">${tabs.map(([v,n])=>`<button type="button" data-r="widget" data-filter="${v}" class="${rUI.reportFilter===v?'active':''}" aria-current="${rUI.reportFilter===v?'page':'false'}">${n} <span class="count">(${Number(counts[v]||0)})</span></button>`).join('')}</nav>
      <div class="r-report-toolbar v16-search"><div class="search">${icon('search',16)}<input type="search" id="r-search" placeholder="Search incidents" value="${esc(rUI.search)}" aria-label="Search my reports" data-r-search="reports"></div><span class="tiny muted">${total} records</span></div>
      <div class="tablewrap v16-tablewrap"><table class="r-table v16-incident-table"><thead><tr>${v16Labels.map(([,label])=>`<th scope="col">${label}</th>`).join('')}</tr></thead><tbody>${shown.map(rReportRow).join('')||'<tr><td colspan="10" class="v16-empty">No matching reports</td></tr>'}</tbody></table></div>
      <div class="r-paging v16-pagination"><span>${total?start+1:0}–${Math.min(start+r13PageSize,total)} of ${total}</span><button type="button" data-reporter-page="previous" ${rUI.reportPage===1?'disabled':''}>Previous</button><span>Page ${rUI.reportPage} of ${pages}</span><button type="button" data-reporter-page="next" ${rUI.reportPage===pages?'disabled':''}>Next</button></div>`;
  };
  const prevWorkflowList=renderWorkflow;
  renderWorkflow=function(){
    // Keep the listing visible while editing; detail always lives in the drawer.
    if(ui.workflowId){const id=ui.workflowId;ui.workflowId=null;const html=prevWorkflowList();ui.workflowId=id;return html}
    return prevWorkflowList();
  };
  let embedded=false,openingDraft=null,openingUnsaved=false;
  const workflowKinds=new Set(['new-workflow','conditions','step','external','action']);
  const priorShow=showModal,priorClose=closeModal,priorRender=render;
  function drawer(){return document.getElementById('v16-workflow-drawer')}
  function createDrawer(){
    let shell=drawer();if(shell)return shell;
    openingDraft=clone(store.draft);openingUnsaved=ui.unsaved;
    shell=document.createElement('div');shell.id='v16-workflow-drawer';shell.className='v16-workflow-drawer';
    shell.innerHTML='<div class="v16-backdrop" data-v16="close"></div><section class="v16-panel" role="dialog" aria-modal="true" aria-label="Configure workflow template"><header class="v16-panelheader"><div><small>Workflow templates</small><h2 id="v16-panel-title">Configure workflow template</h2></div><button type="button" data-v16="close" aria-label="Close workflow configuration">×</button></header><main class="v16-panelbody"></main><footer class="v16-panelfooter"><span>Changes remain in the working draft</span><div><button type="button" class="btn" data-v16="close">Cancel</button><button type="button" class="btn primary" data-v16="save">Save template</button></div></footer></section>';
    document.body.appendChild(shell);return shell;
  }
  function panelContents(){
    const w=wfBy(ui.workflowId);if(!w)return '';
    const editable=renderWorkflowEditor(w).replace('<div class="templateheader">',`<div class="templateheader"><div class="field v16-description"><label for="v16-workflow-description">Description</label><textarea id="v16-workflow-description" rows="2" maxlength="250" data-workflow-field="description" aria-label="Workflow description">${esc(w.description||'')}</textarea></div>`);
    return `<div class="v16-editor">${editable}</div>`;
  }
  function syncDrawer(){
    if(window.CONFIG_V22){drawer()?.remove();return}
    if(ui.workspace!=='admin'||ui.page!=='workflow'||(!ui.workflowId&&!embedded)){
      if(!embedded){drawer()?.remove();document.body.style.overflow=''}return;
    }
    const shell=createDrawer();document.body.style.overflow='hidden';
    if(embedded)return;
    const w=wfBy(ui.workflowId);if(!w){shell.remove();document.body.style.overflow='';return}
    const lastScroll=shell.querySelector('.v16-panelbody')?.scrollTop||0;
    shell.querySelector('#v16-panel-title').textContent=w.name;
    shell.querySelector('.v16-panelheader small').textContent='Configure workflow template';
    shell.querySelector('.v16-panelbody').innerHTML=panelContents();
    shell.querySelector('.v16-panelfooter').hidden=false;
    shell.querySelector('.v16-panelbody').scrollTop=lastScroll;
  }
  showModal=function(kind,title,subtitle,body,footer,opts={}){
    if(window.CONFIG_V22)return priorShow(kind,title,subtitle,body,footer,opts);
    const isWorkflow=ui.workspace==='admin'&&ui.page==='workflow'&&workflowKinds.has(kind);
    if(!isWorkflow)return priorShow(kind,title,subtitle,body,footer,opts);
    priorShow(kind,title,subtitle,body,footer,{...opts,center:false});
    const modal=document.querySelector('#modal-root .dialog');if(!modal)return;
    const shell=createDrawer();embedded=true;
    shell.querySelector('.v16-panelheader small').textContent=kind==='new-workflow'?'New template':'Configure workflow template';
    shell.querySelector('#v16-panel-title').textContent=title;
    shell.querySelector('.v16-panelbody').replaceChildren(modal);
    shell.querySelector('.v16-panelfooter').hidden=true;
    document.getElementById('modal-root').innerHTML='';
    shell.querySelector('.v16-panelbody').scrollTop=0;
  };
  closeModal=function(force=false){
    if(!embedded)return priorClose(force);
    if(!force&&ui.modal?.dirty&&incGuard({msg:'Discard unapplied changes in this editor?'},()=>closeModal(true)))return;
    embedded=false;
    drawer()?.querySelector('.v16-panelbody .dialog')?.remove();
    priorClose(true);syncDrawer();
  };
  render=function(){const value=priorRender();syncDrawer();return value};
  function closeWorkflow(){
    if(embedded){closeModal();return}
    if(openingDraft&&JSON.stringify(openingDraft)!==JSON.stringify(store.draft)){
      if(!confirm('Discard changes made in this workflow editor?'))return;
      store.draft=openingDraft;ui.unsaved=openingUnsaved;
    }
    ui.workflowId=null;drawer()?.remove();document.body.style.overflow='';render();
  }
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-v16]');if(!b)return;
    if(b.dataset.v16==='close'){e.preventDefault();closeWorkflow()}
    if(b.dataset.v16==='save'){
      if(embedded)return;
      saveDraft();ui.workflowId=null;drawer()?.remove();document.body.style.overflow='';render();
    }
  });
  document.addEventListener('keydown',e=>{
    if((e.key==='Enter'||e.key===' ')&&e.target.matches('.v16-openrow')){e.preventDefault();e.target.click()}
  });
  // Role switches and workflow navigation keep the drawer and page in sync.
  render();
})();

</script>

      <section class="c22-tablebox"><div class="c22-search"><h2>${esc(listBy(main)?.name||'Incident types')}</h2><div class="search">${icon('search',15)}<input type="search" placeholder="Search incident categories" aria-label="Search incident categories" data-search-table="c22-types-table"></div></div>
      <table id="c22-types-table" class="c22-table"><thead><tr><th>Main category</th><th>Subtype list (optional)</th><th>Subtypes</th></tr></thead><tbody>
      ${data.map(t=>{const link=config().typeLinks.find(m=>m.typeId===t.id);const linked=link?.useSubtypes&&link.subtypeList?link.subtypeList:'';const child=linked?listBy(linked)?.items||[]:[];return `<tr data-search="${esc((t.name+' '+child.map(c=>c.name).join(' ')).toLowerCase())}"><td><strong>${esc(t.name)}</strong></td><td>${sel('sub-'+t.id,options(),linked,`data-c22-map="${t.id}" aria-label="Subtype list for ${esc(t.name)}"`)}</td><td>${child.length?`<details class="c34-subtypes"><summary>${child.length} ${child.length===1?'subtype':'subtypes'} ${icon('list',15)}</summary><div class="c34-subtype-popover" role="group" aria-label="Subtypes of ${esc(t.name)}"><strong>${esc(t.name)} · Subtypes</strong><ul>${child.map(c=>`<li>${esc(c.name)}</li>`).join('')}</ul></div></details>`:'<span class="muted">—</span>'}</td></tr>`}).join('')}
      </tbody></table><div class="c22-foot">A main category can be used without a subtype list.</div></section></div>`;
  };

  renderSeverity = function() {
    const ls=levels();
    return `<div class="c22-screen"><div class="c22-source-field"><label for="c22-severity-list">Severity list</label>${sel('severityList',[['','Not assigned'],...LISTS.filter(l=>l.kind==='severity').map(l=>[l.id,l.name])],config().severityList,'data-bind="severityList" id="c22-severity-list"')}</div><div class="c22-section-divider"></div>
      <section class="c22-tablebox"><div class="c22-search"><h2>${esc(listBy(config().severityList)?.name||'Severity levels')}</h2><div class="search">${icon('search',15)}<input type="search" placeholder="Search severity levels" aria-label="Search severity levels" data-search-table="c22-severity-table"></div></div><table id="c22-severity-table" class="c22-table"><thead><tr><th>Order</th><th>Severity</th><th>Display color</th><th>Preview</th></tr></thead><tbody>${ls.map(l=>`<tr data-search="${esc(l.name.toLowerCase())}"><td>${l.rank}</td><td><strong>${esc(l.name)}</strong></td><td><div class="coloredit"><input type="color" value="${esc(config().colors[l.id]||'#607D70')}" data-color="${l.id}" aria-label="${esc(l.name)} color"><input type="text" value="${esc(config().colors[l.id]||'#607D70')}" data-colorhex="${l.id}" aria-label="${esc(l.name)} hex color" maxlength="7"></div></td><td><span class="sevbadge"><span class="sevdot" style="background:${esc(config().colors[l.id]||'#607D70')}"></span>${esc(l.name)}</span></td></tr>`).join('')}</tbody></table></section></div>`;
  };

  renderNotifications = function(){
    return `<div class="c22-screen"><section class="c22-tablebox"><div class="c22-search c36-compact"><h2>Notification templates</h2><div class="search">${icon('search',15)}<input type="search" placeholder="Search notifications" aria-label="Search notifications" data-search-table="c22-notification-table"></div></div><table id="c22-notification-table" class="c22-table"><thead><tr><th>Notification</th><th>Trigger</th><th>Channel</th><th class="c22-actions">Actions</th></tr></thead><tbody>${NOTIFICATIONS.map(n=>`<tr data-search="${esc((n.name+' '+(TRIGGER_TEXT[n.trigger]||n.trigger)+' '+n.channels.join(' ')).toLowerCase())}"><td><strong>${esc(n.name)}</strong></td><td>${esc(TRIGGER_TEXT[n.trigger]||n.trigger)}</td><td>${esc(n.channels.join(', '))}</td><td class="c22-actions"><button type="button" class="c22-icon" data-act="notification-preview" data-id="${n.id}" aria-label="View ${esc(n.name)}" title="View">${icon('eye',16)}</button></td></tr>`).join('')}</tbody></table></section></div>`;
  };

  renderSignatures = function(){
    return `<div class="c22-screen"><section class="c22-tablebox"><div class="c22-search c36-compact"><h2>Signature templates</h2><div class="search">${icon('search',15)}<input type="search" placeholder="Search signatures" aria-label="Search signatures" data-search-table="c22-signature-table"></div></div><table id="c22-signature-table" class="c22-table"><thead><tr><th>Signature template</th><th>Response type</th><th>Signing method</th><th class="c22-actions">Actions</th></tr></thead><tbody>${SIGNATURES.map(s=>`<tr data-search="${esc((s.name+' '+responseLabel(s.response)+' '+s.method).toLowerCase())}"><td><strong>${esc(s.name)}</strong></td><td>${esc(responseLabel(s.response))}</td><td>${esc(s.method)}</td><td class="c22-actions"><button type="button" class="c22-icon" data-act="signature-preview" data-id="${s.id}" aria-label="View ${esc(s.name)}" title="View">${icon('eye',16)}</button></td></tr>`).join('')}</tbody></table></section></div>`;
  };

  renderSla = function(){
    return `<div class="c22-screen"><section class="c22-tablebox">${tableHead('SLA targets',headButton('New SLA target','edit-sla','plus'))}<div class="c22-search"><div class="search">${icon('search',15)}<input type="search" placeholder="Search SLA targets" data-search-table="c22-sla-table"></div></div><table id="c22-sla-table" class="c22-table"><thead><tr><th>SLA target</th><th>Starts when</th><th>Complete within</th><th>Calendar</th><th>Overdue alert group</th><th class="c22-actions">Actions</th></tr></thead><tbody>${config().sla.map(s=>`<tr data-search="${esc(s.name.toLowerCase())}"><td><strong>${esc(s.name)}</strong></td><td>${esc(({submission:'Report submission',available:'Step available'})[s.start]||s.start)}</td><td>${esc(targetText(s))}</td><td>${s.calendar==='continuous'?'24/7':'Working hours'}</td><td>${esc(groupName(s.escalation))}</td><td class="c22-actions"><button type="button" class="c22-icon" data-act="edit-sla" data-id="${s.id}" aria-label="Edit ${esc(s.name)}" title="Edit">${icon('pen',16)}</button></td></tr>`).join('')}</tbody></table></section></div>`;
  };

  renderWorkflow = function(){
    if(ui.workflowId&&wfBy(ui.workflowId))return renderWorkflowEditor(wfBy(ui.workflowId));
    return `<div class="c22-screen"><section class="c22-tablebox">${tableHead('Workflow templates',headButton('Add workflow template','new-workflow','plus'))}<table class="c22-table"><thead><tr><th>Template</th><th>Incident types</th><th>Combinations</th><th>Status</th><th class="c22-actions">Actions</th></tr></thead><tbody>${config().workflow.templates.map(w=>`<tr><td><span class="inc-cellflex"><strong class="inc-trunc" title="${esc(w.name)}">${esc(w.name)}</strong>${w.fallback?'<span class="c22-mini">Default</span>':''}</span></td><td>${w.fallback?'All unmatched':w.types.map(typeName).map(esc).join(', ')}</td><td>${w.combinations.length}</td><td>${statusPill(w.enabled?'Enabled':'Draft',w.enabled?'green':'outline')}</td><td class="c22-actions"><button type="button" class="c22-icon" data-act="edit-workflow" data-id="${w.id}" aria-label="Configure ${esc(w.name)}" title="Configure">${icon('pen',16)}</button></td></tr>`).join('')}</tbody></table></section>
    </div>`;
  };

  const workflowEditorPrevious = renderWorkflowEditor;
  renderWorkflowEditor = function(w){
    const c=currentCombo(w);
    ui.comboId=c?.id;
    return `<div class="c22-workspace"><div class="c22-workflow-drawer"><header class="c22-workflow-header"><div><div class="muted small">Configure workflow template</div><h2>${esc(w.name)}</h2></div><button type="button" class="c22-icon" data-act="back-workflows" aria-label="Close workflow editor">${icon('close',19)}</button></header><div class="c22-workflow-body">
      <div class="c22-editgrid">${field('Template name','workflowName',input('workflowName',w.name,'data-workflow-field="name" maxlength="100"'))}${field('Description','workflowDescription',`<textarea name="workflowDescription" data-workflow-field="description" maxlength="250">${esc(w.description||'')}</textarea>`)}</div>
      <div class="c22-workflow-types"><label>Incident types</label>${w.fallback?'<strong>All reports without a matching specific route</strong>':`<div class="multi"><button class="multibtn" type="button" data-act="toggle-type-menu" aria-expanded="false"><span>${w.types.length?w.types.length+' selected':'Select incident types'}</span>${icon('down',14)}</button><div class="multimenu" hidden>${types().map(t=>`<label><input type="checkbox" data-template-type="${t.id}"${checked(w.types.includes(t.id))}><span>${esc(t.name)}</span></label>`).join('')}</div></div><div class="chiprow">${w.types.map(t=>statusPill(esc(typeName(t)))).join('')}</div>`}</div>
      <div class="c22-comboheader"><h3>Severity and urgency combinations <span class="pill">${w.combinations.length}</span></h3>${w.fallback?'':btn('Add combination','add-combination','','','plus')}</div>
      <div class="c22-combo-tabs">${w.combinations.map(co=>`<button type="button" class="${co.id===c?.id?'active':''}" data-act="select-combination" data-id="${co.id}">${esc(co.name)}</button>`).join('')}</div>
      ${c?`<section class="c22-combo">
        <div class="c22-condition"><div><span class="muted small">WHEN</span><div class="actions">${statusPill(esc(severitySummary(c)),'outline')}${statusPill(esc(urgencyLabel(c.urgency)),'outline')}</div></div><div class="actions">${w.fallback?'':btn('Edit conditions','conditions','','','settings')}${!w.fallback&&w.combinations.length>1?btn('Remove combination','remove-combination','danger','','trash'):''}</div></div>
        <div class="c22-step">${c22Summary('First reviewer',groupName(c.first.group),`${responseLabel(c.first.response)} · ${c.first.signature?'Signature required':'No signature'} · ${targetText(slaBy(c.first.sla))}`,'edit-step','data-step="1"')}</div>
        <div class="c22-step">${c22Summary('Second reviewer',c.second?groupName(c.second.group):'Not configured',c.second?`${responseLabel(c.second.response)} · ${c.second.signature?'Signature required':'No signature'} · ${targetText(slaBy(c.second.sla))}`:'Optional','edit-step','data-step="2"')}${c.second?`<button class="c22-minor" data-act="remove-second">Remove second reviewer</button>`:''}</div>
        <div class="c22-step">${c22Summary('External review',c.external.enabled?c.external.destination:'Not required',c.external.enabled?`${groupName(c.external.owner)} · ${targetText(slaBy(c.external.sla))}`:'Optional',c.external.enabled?'external':'toggle-external','')}${c.external.enabled?'<button class="c22-minor" data-act="toggle-external">Remove external review</button>':''}</div>
        <div class="c22-step"><div class="c22-step-label"><div><strong>Follow-up actions</strong><span class="muted small">${c.actions.length} configured</span></div>${btn('Add action','edit-action','','data-id="new"','plus')}</div>${c.actions.map(a=>`<div class="c22-actionitem"><div><strong>${esc(a.title)}</strong><div class="muted small">${esc(groupName(a.group))} · ${esc(targetText(slaBy(a.sla)))}</div></div><button type="button" class="c22-icon" data-act="edit-action" data-id="${a.id}" aria-label="Edit action">${icon('pen',15)}</button></div>`).join('')}</div>
      </section>`:''}
      <div id="c22-inline-editor" hidden></div>
      </div><footer class="c22-workflow-footer">${w.fallback?'':`<label class="c22-enabled"><input type="checkbox" data-c22-enabled="${w.id}"${checked(w.enabled)}> Enabled in draft</label>`}<span class="c22-spacer"></span>${btn('Cancel','back-workflows')}${btn('Save as draft','c22-save-template','primary')}</footer></div></div>`;
  };

  function c22Summary(title,primary,detail,action,attr){
    return `<div class="c22-step-label"><div><strong>${esc(title)}</strong><div>${esc(primary)}</div><span class="muted small">${esc(detail)}</span></div><button class="btn small" type="button" data-act="${action}" ${attr}>${title==='Second reviewer'&&primary==='Not configured'?'Add':'Configure'}</button></div>`;
  }

  // Reuse the existing full-featured forms but show one editor inline, never a nested drawer.
  const sourceShowModal = showModal, sourceCloseModal = closeModal;
  const inlineKinds = new Set(['conditions','step','external','action']);
  showModal = function(kind,title,subtitle,body,footer='',opts={}){
    const container=document.getElementById('c22-inline-editor');
    if(container && inlineKinds.has(kind)){
      ui.lastFocus=document.activeElement;
      ui.modal={kind,data:opts.data||null,dirty:false,c22Inline:true};
      container.hidden=false;
      container.innerHTML=`<section class="c22-inline"><div class="c22-inline-header"><h3>${esc(title)}</h3><button class="c22-icon" data-act="close-modal" aria-label="Cancel editing">${icon('close',17)}</button></div><div class="c22-inline-body" id="dialog-body"><div id="modal-error" class="formerror" hidden></div>${body}</div><div class="c22-inline-footer">${footer}</div></section>`;
      container.scrollIntoView({block:'nearest',behavior:'smooth'});
      return;
    }
    return sourceShowModal(kind,title,subtitle,body,footer,opts);
  };
  closeModal = function(force=false){
    if(ui.modal?.c22Inline){
      if(!force&&ui.modal.dirty&&incGuard({msg:'Discard unapplied changes?'},()=>closeModal(true)))return;
      document.getElementById('c22-inline-editor')?.replaceChildren();
      const el=document.getElementById('c22-inline-editor');if(el)el.hidden=true;
      ui.modal=null;return;
    }
    return sourceCloseModal(force);
  };

  document.addEventListener('change',e=>{
    const el=e.target;
    if(el.matches('[data-c22-map]')){
      const typeId=el.dataset.c22Map;
      let map=config().typeLinks.find(m=>m.typeId===typeId);
      if(!map){map={typeId,useSubtypes:false,subtypeList:''};config().typeLinks.push(map);}
      map.subtypeList=el.value;map.useSubtypes=!!el.value;changed();render();
      e.stopImmediatePropagation();
    }
    if(el.matches('[data-c22-enabled]')){const w=wfBy(el.dataset.c22Enabled);w.enabled=el.checked;changed();render();e.stopImmediatePropagation();}
  },true);
  document.addEventListener('click',e=>{
    const x=e.target.closest('[data-c22-expand]');
    if(x){const tr=document.querySelector('[data-c22-children="'+x.dataset.c22Expand+'"]');if(tr){tr.hidden=!tr.hidden;x.setAttribute('aria-expanded',String(!tr.hidden));}e.stopImmediatePropagation();return;}
    const save=e.target.closest('[data-act="c22-save-template"]');
    if(save){saveDraft();ui.workflowId=null;ui.comboId=null;render();e.stopImmediatePropagation();return;}
    if(ui.modal?.c22Inline&&e.target.closest('[data-act="close-modal"]')){closeModal();e.stopImmediatePropagation();return;}
  },true);
  document.addEventListener('keydown',e=>{
    if(ui.modal?.c22Inline&&e.key==='Tab')e.stopImmediatePropagation();
  },true);
})();

</script>
