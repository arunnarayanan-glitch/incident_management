</style>
<script data-bundled-from="workflow-v23.js">
/* v23 — one 85%-width workflow editor; the full v22 configuration engine remains intact. */
(() => {
  const DEMO_FACILITIES = [
    {id:'FAC-NORTH',name:'North Branch',locations:[{id:'LOC-NORTH',name:'General'},{id:'LOC-N-RES',name:'Residential Unit'},{id:'LOC-N-OUT',name:'Outpatient Clinic'},{id:'LOC-N-ED',name:'Emergency Department'}]},
    {id:'FAC-SOUTH',name:'South Branch',locations:[{id:'LOC-S-RES',name:'Residential Unit'},{id:'LOC-S-OUT',name:'Outpatient Clinic'},{id:'LOC-S-DAY',name:'Day Program'}]}
  ];
  // Mock accessible facilities for the administrator preview; production authorization is Module Installer's responsibility.
  const accessible = DEMO_FACILITIES;
  const state = {open:new Set(['first']),draftBeforeNew:null,newId:null,editSnapshot:null,wasUnsaved:false};
  const E = s=>esc(String(s??''));
  const locs = id=>accessible.find(f=>f.id===id)?.locations||[];
  const activeFacility = w=>w.facilityId||'FAC-NORTH';
  const activeLocations = w=>Array.isArray(w.serviceLocationIds)?w.serviceLocationIds:['LOC-NORTH'];
  const field23=(label,control)=>`<label class="c23-field"><span>${label}</span>${control}</label>`;
  const select23=(value,choices,attrs='')=>`<select ${attrs}>${choices.map(([v,n])=>`<option value="${E(v)}"${value===v?' selected':''}>${E(n)}</option>`).join('')}</select>`;
  const checkbox23=(name,value,checked,attrs='')=>`<label class="c23-check"><input type="checkbox" value="${E(value)}" ${checked?'checked':''} ${attrs}><span>${E(name)}</span></label>`;
  const badge23=(text)=>`<span class="c23-muted">${E(text)}</span>`;
  const allLevels=()=>levels().map(s=>s.id);
  const ACTION_TYPES=[
    'Schedule appointment',
    'Arrange clinical assessment',
    'Notify responsible provider',
    'Update treatment plan',
    'Document follow-up',
    'Arrange external consultation',
    'Other follow-up'
  ];
  window.incActionTypes=ACTION_TYPES;

  function groupField(key,s,n){return field23('Reviewer group',select23(s.group,groupOptions(true),`data-c23-step="${n}" data-c23-field="group"`));}
  function reviewerForm(s,n){
    const condition=n===2?field23('Start condition',select23(s.start,[['manual','Sent by first reviewer'],['immediate','Immediately'],['after_response','After first response'],['after_complete','After first review completes']],`data-c23-step="2" data-c23-field="start"`)):'';
    return `<div class="c23-grid2">
      ${groupField('group',s,n)}
      ${field23('Expected response',select23(s.response,[['approval','Approval'],['acknowledgment','Acknowledgment']],`data-c23-step="${n}" data-c23-field="response"`))}
      ${field23('Completion SLA target',select23(s.sla,slaOptions(['review']),`data-c23-step="${n}" data-c23-field="sla"`))}
      ${field23('Notification',select23(s.notification,notificationOptions('review.assigned'),`data-c23-step="${n}" data-c23-field="notification"`))}
      ${condition}
      <div class="c23-field"><span>Signature</span><label class="c23-check c23-toggle"><input type="checkbox" data-c23-step="${n}" data-c23-field="signature" ${s.signature?'checked':''}><span>Require signature</span></label></div>
      ${s.signature?field23('Signature template',select23(s.signatureTemplate,[['','Select signature'],...SIGNATURES.filter(t=>t.response===s.response).map(t=>[t.id,t.name])],`data-c23-step="${n}" data-c23-field="signatureTemplate"`)):''}
    </div>`;
  }
  function accordion(key,label,content,opts={}){
    const open=state.open.has(key);
    return `<section class="c23-accordion" data-c23-accordion="${key}">
      <div class="c23-accordion-head">
        <button type="button" class="c23-accordion-trigger c38-chev" data-c23-accordion-toggle="${key}" aria-expanded="${open}" aria-label="${label} section">${icon(open?'down':'chevron',15)}</button>
        ${opts.optional?`<label class="c23-switch"><input type="checkbox" data-c23-optional="${key}" aria-label="Use ${label}" ${opts.enabled?'checked':''}><span class="c23-switch-track"></span></label>`:''}
        <button type="button" class="c23-accordion-trigger c38-title" data-c23-accordion-toggle="${key}" aria-expanded="${open}"><strong>${label}</strong></button>
        <span class="c38-head-right">${opts.action||''}</span>
      </div>
      <div class="c23-accordion-content" ${open?'':'hidden'}>${content}</div>
    </section>`;
  }
  function multiType(w){
    const list=types();
    return `<details class="c23-multiselect"><summary>${w.types.length?w.types.length+' selected':'Select incident types'}${icon('down',13)}</summary><div class="c23-options">${list.map(t=>checkbox23(t.name,t.id,w.types.includes(t.id),'data-c23-type')).join('')}</div></details>`;
  }
  function locationControl(w){
    const facility=activeFacility(w),values=activeLocations(w),available=locs(facility);
    return `<details class="c23-multiselect" ${facility?'':'data-disabled'}><summary>${values.length===available.length&&values.length?'All service locations':values.length?values.length+' locations selected':'Select service locations'}${icon('down',13)}</summary><div class="c23-options">
      ${checkbox23('Select all','all',!!available.length&&available.every(x=>values.includes(x.id)),'data-c23-location-all')}
      <div class="c23-option-divider"></div>
      ${available.map(l=>checkbox23(l.name,l.id,values.includes(l.id),'data-c23-location')).join('')}
    </div></details>`;
  }
  function severityControl(c){
    const vals=c.severityMode==='selected'?c.severities:[];
    const all=allLevels();
    const label=vals.length===all.length&&all.length?'All severities':vals.length?vals.map(levelName).join(', '):'No severity filter';
    return `<details class="c23-multiselect c23-severity"><summary>${E(label)}${icon('down',13)}</summary><div class="c23-options">
      ${checkbox23('Select all','all',!!all.length&&all.every(x=>vals.includes(x)),'data-c23-severity-all')}
      <div class="c23-option-divider"></div>
      ${levels().map(l=>checkbox23(l.name,l.id,vals.includes(l.id),'data-c23-severity')).join('')}
    </div></details>`;
  }
  function followup(c){
    return `<div class="c23-followups">${c.actions.length?'':'<p class="c38-empty">No follow-up actions yet.</p>'}
      ${c.actions.map((a,i)=>`<details class="c23-action-card" open><summary class="c23-action-head"><strong>${E(a.title||'New action')}</strong><button type="button" class="c22-icon" data-c23-remove-action="${a.id}" title="Remove action" aria-label="Remove action">${icon('trash',15)}</button></summary>
        <div class="c23-grid2 c23-action-fields">
          ${field23('Action type <b class="c38-req" aria-hidden="true">*</b>',select23(a.title,[['','Select'],...(a.title&&!ACTION_TYPES.includes(a.title)?[[a.title,a.title]]:[]),...ACTION_TYPES.map(t=>[t,t])],`data-c23-action="${a.id}" data-c23-action-field="title" aria-required="true"`))}
          ${field23('Responsible group',select23(a.group,groupOptions(),`data-c23-action="${a.id}" data-c23-action-field="group"`))}
          ${field23('Start condition',select23(a.start,[['immediate','Immediately'],['after_reviews','After required reviews']],`data-c23-action="${a.id}" data-c23-action-field="start"`))}
          ${field23('Completion SLA target',select23(a.sla,slaOptions(['action']),`data-c23-action="${a.id}" data-c23-action-field="sla"`))}
          ${field23('Required',select23(a.required===false?'no':'yes',[['yes','Yes'],['no','No']],`data-c23-action="${a.id}" data-c23-action-field="required"`))}
        </div>
      </details>`).join('')}
    </div>`;
  }
  function combination(c,w){
    const fallback=w.fallback;
    return `<div class="c23-configuration">
      <div class="c23-grid3">
        ${field23('Combination name',`<input type="text" value="${E(c.name)}" maxlength="80" data-c23-combo-field="name" aria-label="Combination name">`)}
        ${field23('Severity',fallback?'<div class="c23-readonly">Any severity</div>':severityControl(c))}
        ${field23('Urgency',fallback?'<div class="c23-readonly">Any urgency</div>':select23(c.urgency,[['any','Any urgency'],['yes','Yes'],['no','No'],['unknown','Not sure']],`data-c23-combo-field="urgency"`))}
      </div>
      <div class="c23-accordions">
        ${accordion('first','First reviewer',reviewerForm(c.first,1))}
        ${accordion('second','Second reviewer',c.second?reviewerForm(c.second,2):'',{optional:true,enabled:!!c.second})}
        ${accordion('external','External review',c.external.enabled?`<div class="c23-grid2">
          ${field23('External destination',`<input data-c23-external="destination" value="${E(c.external.destination)}" maxlength="200" aria-label="External destination">`)}
          ${field23('Responsible internal group',select23(c.external.owner,groupOptions(true),'data-c23-external="owner"'))}
          ${field23('Completion SLA target',select23(c.external.sla,slaOptions(['external']),'data-c23-external="sla"'))}
        </div>`:'',{optional:true,enabled:!!c.external.enabled})}
        ${accordion('followup','Follow-up actions',followup(c),{action:`<span class="c23-count">${c.actions.length}</span><button type="button" class="c38-textbtn" data-c23-add-action>+ Add action</button>`})}
      </div>
    </div>`;
  }
  renderWorkflowEditor = function(w){
    const c=currentCombo(w);ui.comboId=c?.id;
    const facility=activeFacility(w);
    const adding=state.newId===w.id;
    return `<div class="c23-workspace">
      <section class="c23-drawer" role="dialog" aria-label="${adding?'Add workflow':'Edit workflow'}">
        <header class="c23-header"><h2>${adding?'Add workflow':'Edit workflow'}</h2><button type="button" class="c22-icon" data-act="c23-cancel" title="Close" aria-label="Close workflow">${icon('close',20)}</button></header>
        <main class="c23-body">
          <div class="c23-grid2 c23-template-fields">
            ${field23('Template name',`<input type="text" maxlength="100" value="${E(w.name)}" data-c23-template="name" placeholder="Template name" aria-label="Template name">`)}
            ${field23('Incident types',fallbackTypes(w,multiType))}
            <div class="c23-full">${field23('Description',`<textarea data-c23-template="description" rows="2" maxlength="250" placeholder="Description" aria-label="Description">${E(w.description||'')}</textarea>`)}</div>
            ${field23('Facility',select23(facility,accessible.map(f=>[f.id,f.name]),'data-c23-facility aria-label="Facility"'))}
            ${field23('Service Locations',locationControl(w))}
          </div>
          <div class="c23-section-header"><h3>Combinations</h3>${w.fallback?'':`<button class="btn small" type="button" data-c23-add-combo>${icon('plus',14)} Add combination</button>`}</div>
          <div class="c23-combo-layout">
            <nav class="c23-combo-nav" aria-label="Workflow combinations">
              <div class="c23-pane-title">Combinations</div>
              ${w.combinations.map((item,i)=>`<div class="c23-combo-row ${item.id===c?.id?'selected':''}">
                <button class="c23-combo-item" type="button" data-c23-combo-id="${item.id}" aria-current="${item.id===c?.id?'true':'false'}"><strong>${E(item.name||'Combo '+(i+1))}</strong></button>
                ${!w.fallback?`<button type="button" class="c22-icon c23-delete-combo" data-c23-delete-combo="${item.id}" ${w.combinations.length<=1?'disabled':''} title="Delete combination" aria-label="Delete ${E(item.name||'Combo '+(i+1))}">${icon('trash',14)}</button>`:''}
              </div>`).join('')}
            </nav>
            <section class="c23-combo-pane"><div class="c23-pane-title">Combination settings</div>${c?combination(c,w):'<div class="c23-empty">At least one combination is required.</div>'}</section>
          </div>
          <div id="c22-inline-editor" hidden></div>
        </main>
        <footer class="c23-footer">
          <span class="c23-flex"></span>
          <button class="btn" type="button" data-act="c23-cancel">Cancel</button>
          <button class="btn primary" type="button" data-act="c23-save">${adding?'Save':'Update'}</button>
        </footer>
      </section>
    </div>`;
  };
  function fallbackTypes(w,fn){return w.fallback?'<div class="c23-readonly">All unmatched incident types</div>':fn(w)}

  // New templates open in the same editor and only become real drafts when saved.
  openNewWorkflow = function(){
    if(state.newId)return;
    state.wasUnsaved=ui.unsaved;
    state.draftBeforeNew=clone(store.draft);
    const w={id:id('WF'),name:'',description:'',fallback:false,enabled:false,types:[],facilityId:'FAC-NORTH',serviceLocationIds:locs('FAC-NORTH').map(x=>x.id),combinations:[newCombination({name:'Combo 1',severityMode:'any',severities:[],urgency:'any'})]};
    config().workflow.templates.push(w);
    state.newId=w.id;
    state.editSnapshot=null;
    state.open=new Set(['first']);
    ui.page='workflow';ui.workflowId=w.id;ui.comboId=w.combinations[0].id;render();
  };

  function current(){const w=wfBy(ui.workflowId);return {w,c:w?currentCombo(w):null};}
  function rerenderPreserve(){
    const el=document.querySelector('.c23-body');const y=el?.scrollTop||0;
    render();const next=document.querySelector('.c23-body');if(next)next.scrollTop=y;
  }
  function discard(){
    if(state.newId&&state.draftBeforeNew)store.draft=state.draftBeforeNew;
    else if(state.editSnapshot)store.draft=state.editSnapshot;
    if(state.editSnapshot||state.draftBeforeNew)ui.unsaved=state.wasUnsaved;
    state.draftBeforeNew=null;state.newId=null;state.editSnapshot=null;
    ui.workflowId=null;ui.comboId=null;state.open=new Set(['first']);render();
  }
  function save(activate){
    const {w}=current();if(!w)return;const wasNew=state.newId===w.id;
    if(window.c38ValidatePanel&&!window.c38ValidatePanel(w))return;
    w.facilityId=activeFacility(w);w.serviceLocationIds=[...activeLocations(w)];
    if((activate||wasNew)&&!w.fallback)w.enabled=true;
    state.newId=null;state.draftBeforeNew=null;state.editSnapshot=null;
    changed();saveDraft('Workflow template saved. Select Update configuration to apply it.');ui.workflowId=null;ui.comboId=null;render();
    if(activate)openPublish();
  }

  function scopeMatch(w,location){
    if(!w.facilityId&&!w.serviceLocationIds)return true; // historical templates retain original scope
    const loc=DEMO_FACILITIES.flatMap(f=>f.locations.map(l=>({...l,facilityId:f.id}))).find(l=>l.id===location);
    if(!loc)return true; // explicit unknown location falls back to pre-existing routing
    return (!w.facilityId||w.facilityId===loc.facilityId)&&(!Array.isArray(w.serviceLocationIds)||w.serviceLocationIds.includes(location));
  }
  const priorRoute=rRoute;
  rRoute=function(conf,form){
    const scoped={...conf,workflow:{...conf.workflow,templates:conf.workflow.templates.filter(w=>w.fallback||scopeMatch(w,REPORTER.location))}};
    return priorRoute(scoped,form);
  };

  // Move the retained action editor into its owning accordion instead of stacking a new drawer.
  const priorShowModal=showModal;
  showModal=function(kind,title,subtitle,body,footer,opts){
    const result=priorShowModal(kind,title,subtitle,body,footer,opts);
    if(ui.modal?.c22Inline){
      const section=kind==='action'?'followup':kind==='step'?(ui.modal?.data?.n===2?'second':'first'):kind==='external'?'external':null;
      if(section){const home=document.querySelector('.c23-accordion[data-c23-accordion="'+section+'"] .c23-accordion-content');
        const el=document.getElementById('c22-inline-editor');
        if(home&&el){home.appendChild(el);home.hidden=false;const trigger=document.querySelector('[data-c23-accordion-toggle="'+section+'"]');trigger?.setAttribute('aria-expanded','true');state.open.add(section);}
      }
    }
    return result;
  };

  function onChange(el){
    const {w,c}=current();if(!w)return false;
    if(el.matches('[data-c23-template]')){
      const key=el.dataset.c23Template;
      w[key]=key==='enabled'?el.checked:el.value;
      changed();return true;
    }
    if(el.matches('[data-c23-facility]')){
      w.facilityId=el.value;w.serviceLocationIds=[];changed();rerenderPreserve();return true;
    }
    if(el.matches('[data-c23-type]')){
      w.types=el.checked?[...new Set([...w.types,el.value])]:w.types.filter(x=>x!==el.value);
      changed();const summary=el.closest('details')?.querySelector('summary');
      if(summary)summary.firstChild.textContent=w.types.length+' selected';
      return true;
    }
    if(el.matches('[data-c23-location-all], [data-c23-location]')){
      const all=locs(activeFacility(w)).map(x=>x.id);
      if(el.hasAttribute('data-c23-location-all'))w.serviceLocationIds=el.checked?all:[];
      else w.serviceLocationIds=el.checked?[...new Set([...activeLocations(w),el.value])]:activeLocations(w).filter(id=>id!==el.value);
      changed();const details=el.closest('details');const values=activeLocations(w);
      details.querySelector('summary').firstChild.textContent=values.length===all.length&&all.length?'All service locations':values.length?values.length+' locations selected':'Select service locations';
      details.querySelector('[data-c23-location-all]').checked=all.every(id=>values.includes(id));
      details.querySelectorAll('[data-c23-location]').forEach(box=>box.checked=values.includes(box.value));
      return true;
    }
    if(!c)return false;
    if(el.matches('[data-c23-combo-field]')){
      c[el.dataset.c23ComboField]=el.value;
      changed();if(el.dataset.c23ComboField==='name')document.querySelector('.c23-combo-item.selected strong').textContent=el.value||'Combo';return true;
    }
    if(el.matches('[data-c23-severity-all], [data-c23-severity]')){
      let selected=c.severityMode==='selected'?[...c.severities]:[];
      if(el.hasAttribute('data-c23-severity-all'))selected=el.checked?allLevels():[];
      else selected=el.checked?[...new Set([...selected,el.value])]:selected.filter(x=>x!==el.value);
      c.severities=selected;c.severityMode=selected.length?'selected':'any';changed();
      const detail=el.closest('details'),all=allLevels();
      detail.querySelector('summary').firstChild.textContent=!selected.length?'No severity filter':selected.length===all.length?'All severities':selected.map(levelName).join(', ');
      detail.querySelectorAll('[data-c23-severity]').forEach(input=>input.checked=selected.includes(input.value));
      detail.querySelector('[data-c23-severity-all]').checked=all.every(id=>selected.includes(id));return true;
    }
    if(el.matches('[data-c23-step]')){
      const n=Number(el.dataset.c23Step),step=n===1?c.first:c.second;if(!step)return true;
      const key=el.dataset.c23Field;step[key]=key==='signature'?el.checked:el.value;
      if(key==='response'&&step.signature&&!SIGNATURES.some(s=>s.id===step.signatureTemplate&&s.response===step.response))step.signatureTemplate=SIGNATURES.find(s=>s.response===step.response)?.id||'';
      if(key==='signature'&&!step.signature)step.signatureTemplate='';
      changed();if(key==='signature'||key==='response')rerenderPreserve();return true;
    }
    if(el.matches('[data-c23-external]')){c.external[el.dataset.c23External]=el.value;changed();return true;}
    if(el.matches('[data-c23-action]')){
      const action=c.actions.find(a=>a.id===el.dataset.c23Action);
      if(action){if(el.dataset.c23ActionField==='required')action.required=el.value!=='no';else action[el.dataset.c23ActionField]=el.value;changed();
        if(el.dataset.c23ActionField==='title')el.closest('.c23-action-card')?.querySelector('.c23-action-head strong').replaceChildren(document.createTextNode(el.value||'New action'));}
      return true;
    }
    if(el.matches('[data-c23-optional]')){
      const key=el.dataset.c23Optional;
      if(key==='second')c.second=el.checked?defaultStep({group:'facility:oversight',sla:'SLA-SECOND',start:'manual'}):null;
      if(key==='external')c.external.enabled=el.checked;
      state.open.add(key);changed();rerenderPreserve();return true;
    }
    return false;
  }
  document.addEventListener('change',e=>{
    if(e.target.closest('.c23-drawer')&&onChange(e.target))e.stopImmediatePropagation();
  },true);
  document.addEventListener('input',e=>{
    if(e.target.closest('.c23-drawer')&&e.target.matches('[data-c23-template="name"],[data-c23-template="description"],[data-c23-combo-field="name"],[data-c23-external="destination"]'))onChange(e.target);
  },true);
  document.addEventListener('click',e=>{
    // Multiselects stay open while their controls are used; clicking elsewhere dismisses them.
    const dropdown=e.target.closest('.c23-multiselect');
    const summary=e.target.closest('.c23-multiselect > summary');
    if(summary){
      const target=summary.parentElement;
      document.querySelectorAll('.c23-multiselect[open]').forEach(d=>{if(d!==target)d.open=false;});
      if(target.open)e.preventDefault();
    }else if(!dropdown){
      document.querySelectorAll('.c23-multiselect[open]').forEach(d=>d.open=false);
    }
  },true);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')document.querySelectorAll('.c23-multiselect[open]').forEach(d=>d.open=false);
  },true);
  document.addEventListener('click',e=>{
    const el=e.target.closest('button');
    if(el?.matches('[data-act="edit-workflow"]')&&!state.newId){
      state.editSnapshot=clone(store.draft);
      state.wasUnsaved=ui.unsaved;
      state.open=new Set(['first']);
    }
    if(!el||!el.closest('.c23-drawer'))return;
    const {w,c}=current();if(!w)return;
    if(el.matches('[data-c23-combo-id]')){
      ui.comboId=el.dataset.c23ComboId;state.open=new Set(['first']);rerenderPreserve();e.stopImmediatePropagation();return;
    }
    if(el.matches('[data-c23-add-combo]')){
      const number=w.combinations.length+1;

/* Shared panel interaction atom: native dropdown details dismiss on outside click.

(() => {
  const panelSelector = '.c23-drawer,.rp-drawer,.vr14-drawer,.c22-workflow-drawer,.v16-panel,#modal-root .dialog';
  const menuSelector = 'details.c23-multiselect[open],details.r-action-multi[open]';
  const openMenus = () => [...document.querySelectorAll(menuSelector)].filter(menu => menu.closest(panelSelector));
  document.addEventListener('pointerdown', event => {
    for (const menu of openMenus()) {
      if (!menu.contains(event.target)) menu.open = false;
    }
  }, true);
  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    const active = openMenus();
    if (!active.length) return;
    for (const menu of active) menu.open = false;
    event.preventDefault();
    event.stopPropagation();
  }, true);
})();

<script data-bundled-from="configuration-compact-v34.js">
/* Configuration-only refinement: preserve modal and draft behavior. */
(() => {
  const priorShowModal = showModal;
  showModal = function(kind, title, subtitle, body, footer = '', opts = {}) {
    const result = priorShowModal(kind, title, subtitle, body, footer, opts);
    if (['notification-preview', 'signature-preview', 'sla'].includes(kind)) {
      const dialog = document.querySelector('#modal-root .dialog');
      if (dialog) dialog.classList.add('c34-compact-dialog', `c34-${kind}`);
      const content = dialog?.querySelector('.dialogbody');
      if (content && kind !== 'sla') {
        const details = [...content.children].filter(child => child.classList.contains('readline'));
        if (details.length) {
          const section = document.createElement('section');
          section.className = 'c35-meta-section';
          const heading = document.createElement('h3');
          heading.textContent = kind === 'notification-preview' ? 'Notification details' : 'Signature details';
          const grid = document.createElement('div');
          grid.className = 'c35-meta-grid';
          details[0].before(section);
          section.append(heading, grid);
          details.forEach((detail, index) => {
            detail.classList.add('c35-detail');
            if (index === 2 || (kind === 'signature-preview' && index === 1)) detail.classList.add('c35-full');
            grid.append(detail);
          });
        }
        const subject = [...content.querySelectorAll(':scope > .field')];
        if (subject.length) {
          const heading = document.createElement('h3');
          heading.className = 'c35-message-heading';
          heading.textContent = kind === 'notification-preview' ? 'Message preview' : 'Signature statement';
          subject[0].before(heading);
          subject.forEach(field => field.classList.add('c35-preview-field'));
        }
      }
    }
    return result;
  };

  // Only one subtype detail popover should be visible at a time.
  document.addEventListener('toggle', event => {
    const details = event.target;
    if (!details.matches?.('.c34-subtypes') || !details.open) return;
    document.querySelectorAll('.c34-subtypes[open]').forEach(other => {
      if (other !== details) other.open = false;
    });
  }, true);
})();

</script>

 const svcName=id=>(LOCMAP[id]||[])[0]||'—',facOf=id=>(LOCMAP[id]||[])[1]||'—';

 const sortIcon=dir=>`<svg width="12" height="14" viewBox="0 0 12 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 5.5 3-3 3 3" opacity="${dir==='desc'||dir==='none'?(dir==='none'?.45:.3):1}"/><path d="m3 8.5 3 3 3-3" opacity="${dir==='asc'||dir==='none'?(dir==='none'?.45:.3):1}"/></svg>`;

 function pageList(pages,cur){
  if(pages<=7)return Array.from({length:pages},(_,i)=>i+1);

   const narrowed=Boolean(String(st.q||'').trim()||st.f.type!=='all'||st.f.severity!=='all'||st.f.urgency!=='all'||st.quick||advCount(st));

 const incidentColsBase=kind=>[
  {k:'id',label:'Incident ID',w:98,sort:true,first:'asc'},

(function(){

 };

 /* ---------- confirmation dialogs ---------- */

 function enableBlocker(w){
  if(!w.types.length)return 'It has no incident types selected. Edit the template and choose at least one.';
  for(const o of templates()){
   if(o===w||o.fallback||!o.enabled)continue;
   for(const c of w.combinations)for(const oc of o.combinations)
    if(intersects(w.types,o.types)&&intersects(severitySet(c),severitySet(oc))&&intersects(urgencySet(c),urgencySet(oc)))
     return `Its routes overlap with “${o.name} / ${oc.name}”: same incident types, severity and urgency. Change the conditions of one template first.`;
  }

 }
 function askToggle(id){

  }else{
   const block=enableBlocker(w);
   if(block){dialog({title:`${w.name} can’t be enabled`,body:block,focusId:fid});return}
   dialog({title:`Enable ${w.name}?`,body:`New reports of ${listText(w.types.map(typeName))} will use this template again.`,ok:'Enable',focusId:fid,onOk(){w.enabled=true;commit()}});

 document.addEventListener('keydown',e=>{

 /* ---------- panels ---------- */

 /* ---------- SLA target panel: compact grid, same fields ---------- */
 openSla=function(sid){

</form>`;
  showModal('sla',fresh?'New SLA target':e.name,'',body,formFooter(),{center:false,data:{e,fresh}});
 };

 /* ---------- configuration footer: Update configuration / Cancel ---------- */
 const dirty=()=>JSON.stringify(store.draft)!==JSON.stringify(store.published);
 const PAGES={types:'Incident types',severity:'Severity',workflow:'Workflow',notification:'Notifications',signature:'Signatures',sla:'SLA targets'};
 function drawFooter(){
  let f=document.getElementById('c38-footer');
  if(ui.workspace!=='admin'){f?.remove();document.body.classList.remove('c38-has-footer');return}
  if(!f){
   f=document.createElement('footer');f.id='c38-footer';f.className='c38-config-footer';
   f.innerHTML='<button type="button" class="btn" data-c38="cancel">Cancel</button><button type="button" class="btn primary" data-c38="update">Update configuration</button>';
   document.body.appendChild(f);

 document.addEventListener('click',e=>{

 },true);

 /* ---------- SLA panel: errors appear under the field ---------- */
 function slaErrors(fd){
  const num=n=>{const t=String(fd.get(n)??'').trim();return t===''?NaN:Number(t)};
  const e={target:num('target'),unit:fd.get('unit'),warning:num('warning')};
  const out={};
  if(!String(fd.get('name')||'').trim())out.name='Enter a name.';
  if(!Number.isInteger(e.target)||e.target<1)out.target='Enter a whole number of 1 or more.';
  if(!Number.isInteger(e.warning)||e.warning<0)out.warning='Enter a whole number of 0 or more.';
  else if(Number.isInteger(e.target)&&e.target>=1&&e.warning>=duration(e))out.warning='Must be shorter than the target.';

  return out;
 }

  for(const c of w.combinations){
   const p='c|'+c.id+'|',x={combo:c.id};

   const step=(s,k)=>{

   }
   if(c.external.enabled){
    if(!String(c.external.destination||'').trim())add(p+'ext.destination','Enter the external destination.',{...x,section:'external'});
    if(!groupBy(c.external.owner))add(p+'ext.owner','Select a responsible group.',{...x,section:'external'});
    if(slaBy(c.external.sla)?.measure!=='external')add(p+'ext.sla','Select a completion SLA target.',{...x,section:'external'});
   }
   for(const a of c.actions){

    if(!String(a.title||'').trim())add(q+'title','Select an action type.',y);

  let h=0;for(const ch of name)h=(h*31+ch.charCodeAt(0))>>>0;

   const btn=rev?`<td class="inc-r">${done?`<button type="button" class="tbl-btn" data-inc-undo="${esc(r.id)}" data-act="${esc(a.id)}" aria-label="Undo completion: ${esc(a.title)}" ${open?'':'disabled'} title="${esc(lock)}">Undo</button>`:`<button type="button" class="tbl-btn primary" data-inc-complete="${esc(r.id)}" data-act="${esc(a.id)}" aria-label="Mark complete: ${esc(a.title)}" ${open?'':'disabled'} title="${esc(lock)}">Mark complete</button>`}</td>`:'';

.inc-form{display:flex;flex-direction:column;gap:14px;padding:2px 0 0}
.inc-fsec{border:1px solid #d5dee6;border-radius:4px;background:#fff}
.inc-fsec-head{display:flex;align-items:center;gap:10px;width:100%;padding:14px 18px;margin:0;background:#eaf1f8;border:0;border-radius:4px;font:inherit;text-align:left;color:#1f3a56;cursor:pointer}
.inc-fsec-head[aria-expanded="true"]{border-radius:4px 4px 0 0;border-bottom:1px solid #d5dee6}
.inc-fsec-head:focus-visible{outline:2px solid #1c75a2;outline-offset:-2px}
.inc-fsec-head h3{margin:0;font-size:14px;font-weight:600}
.inc-fsec-head .inc-chev{flex:none;transition:transform .15s ease}
.inc-fsec-head[aria-expanded="false"] .inc-chev{transform:rotate(-90deg)}
.inc-fsec-meta{margin-left:auto;font-size:12px;color:#5d7183}
.inc-fsec-meta.warn{color:#b3303a;font-weight:600}
.inc-fsec-body{padding:18px}
.inc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 28px;align-items:start}
.inc-triple{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 24px;align-items:start}
.inc-span2{grid-column:1/-1}
.inc-ff{display:flex;flex-direction:column;gap:6px;min-width:0}
.inc-ff>label,.inc-ff>.inc-lab{margin:0;font-size:13px;font-weight:600;line-height:18px;color:#2b4153}
.inc-req{color:#c0392b;font-weight:700;margin-left:2px}
.inc-help{margin:0;min-height:16px;font-size:12px;line-height:16px;font-weight:400;color:#5d7183}
.inc-ferr{margin:2px 0 0;font-size:12px;color:#b3303a}
.inc-none{margin:0 0 16px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.inc-form input[type=datetime-local],.inc-form .r-classbutton,.inc-form .r-severityrow select{height:40px;box-sizing:border-box}
.inc-form .r-classbutton span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inc-form .r-radio{display:flex;gap:8px;flex-wrap:wrap}
.inc-form .r-radio label{min-height:40px;box-sizing:border-box;padding:0 14px;display:inline-flex;align-items:center;gap:8px}
.inc-form .r-severityrow{display:flex;align-items:center;gap:10px}
.inc-form .r-severityrow select{flex:1;min-width:0}
.inc-form textarea{min-height:104px}
.inc-addfiles{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;cursor:pointer;height:40px;box-sizing:border-box}
.inc-form .r-formfooter{margin-top:6px}
/* people: a one-line field. Tags stay inside it, long text is cut, extra tags fold into "+N". */
.inc-triple .r-searchwrap{position:relative}
.inc-form .r-person-combobox{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;height:40px;min-height:40px;padding:0 8px;box-sizing:border-box;overflow:hidden;border:1px solid #cdd8e2;border-radius:4px;background:#fff}
.inc-form .r-person-combobox:focus-within{border-color:#1A4F85;box-shadow:0 0 0 2px #d9e6f2}
.inc-form .r-person-combobox .r-chip{flex:0 1 auto;min-width:64px;max-width:62%;display:inline-flex;align-items:center;gap:4px;height:26px;margin:0}
.inc-form .r-person-combobox .r-chip[hidden]{display:none}
.inc-form .r-person-combobox.measuring .r-chip{flex:none}
.inc-chip-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inc-form .r-person-combobox .r-chip button{flex:none}
.inc-more{flex:none;height:26px;padding:0 8px;border:0;border-radius:13px;background:#d9e6f2;color:#1A4F85;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.inc-form .r-person-combobox input{flex:1 1 70px;min-width:70px;height:32px!important;border:0!important;box-shadow:none!important;outline:0!important;background:transparent!important;padding:0 4px!important}
.inc-form .r-person-combobox.is-disabled,.inc-form .is-disabled input{background:#f4f6f8!important;color:#66747f;cursor:not-allowed}
.inc-result{display:flex;align-items:center;gap:10px;width:100%;min-width:0;padding:9px 12px;background:#fff;border:0;border-bottom:1px solid #edf1f4;font:inherit;font-size:13px;text-align:left;cursor:pointer}
.inc-result:last-child{border-bottom:0}
.inc-result:hover,.inc-result:focus-visible{background:#f3f8fc;outline:0}
.inc-result.is-on{background:#f3f8fc}
.inc-result strong{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inc-result .mono{flex:none;color:#5d7183}
.inc-tick{flex:none;width:14px;height:14px;color:#1A4F85}
@media(max-width:900px){.inc-grid,.inc-triple{grid-template-columns:minmax(0,1fr)}}
</style>
<script data-bundled-from="simple-form-v6.js">
/* Report incident: four accordions. Incident type and description are required; everything else is optional. */
(function(){
 'use strict';
 const LISTS={affected:{patient:'patients',employee:'employees',other:'others'},involved:{patient:'involvedPatients',employee:'involvedEmployees',other:'involvedOthers'}};
 const star='<span class="inc-req" aria-hidden="true">*</span><span class="sr-only"> (required)</span>';
 const chev='<svg class="inc-chev" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
 const tick='<svg class="inc-tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
 const nameOf=(kind,v)=>kind==='patient'?(rCanPatient(v)?(rPatient(v)||{}).name:'Patient details restricted'):kind==='employee'?((EMPLOYEES.find(e=>e.id===v)||{}).name||'Employee'):v;
 const any=(f,list)=>Object.values(LISTS[list]).some(k=>f[k].length);
 const count=(f,list)=>Object.values(LISTS[list]).reduce((n,k)=>n+f[k].length,0);
 const noneKey=list=>list==='affected'?'affectedNone':'involvedNone';
 const unkKey=list=>list==='affected'?'affectedUnknown':'involvedUnknown';
 const onKey=list=>list==='affected'?'affectedOn':'involvedOn';
 const stashKey=list=>list==='affected'?'affectedStash':'involvedStash';
 const label0=list=>list==='affected'?'No person affected':'No person involved';
 const syncAffected=f=>{const on=f.affectedOn||{};f.affected=f.affectedNone?['none']:f.affectedUnknown?['unknown']:[(f.patients.length||on.patient)?'patient':'',(f.employees.length||on.employee)?'employee':'',(f.others.length||on.other)?'other':''].filter(Boolean)};
 const ensure=f=>{
  ['involvedPatients','involvedEmployees','involvedOthers'].forEach(k=>{if(!Array.isArray(f[k]))f[k]=[]});
  if(!Array.isArray(f.caused))f.caused=[];
  if(f.affectedNone===undefined)f.affectedNone=(f.affected||[]).includes('none');
  if(f.involvedNone===undefined)f.involvedNone=false;
  if(f.affectedUnknown===undefined)f.affectedUnknown=(f.affected||[]).includes('unknown');
  if(f.involvedUnknown===undefined)f.involvedUnknown=false;
  if(!f.affectedOn)f.affectedOn={patient:f.patients.length>0||(f.affected||[]).includes('patient'),employee:f.employees.length>0||(f.affected||[]).includes('employee'),other:f.others.length>0||(f.affected||[]).includes('other')};
  if(!f.involvedOn)f.involvedOn={patient:f.involvedPatients.length>0,employee:f.involvedEmployees.length>0,other:f.involvedOthers.length>0};
  if(!f.pplStash)f.pplStash={affected:{},involved:{}};
  syncAffected(f);
  if(!f.urgency)f.urgency='unknown';
 };
 const err=k=>rUI.fieldErrors&&rUI.fieldErrors[k]?`<p class="inc-ferr" role="alert" id="inc-err-${k}">${esc(rUI.fieldErrors[k])}</p>`:'';
 const ff=(key,label,body,o={})=>`<div class="inc-ff${o.span?' inc-span2':''}" data-ff="${key}"><label id="inc-lbl-${key}"${o.forId?` for="${o.forId}"`:''}>${label}${o.required?star:''}</label>${body}${err(key)}</div>`;

 const chip=(list,kind,v)=>`<span class="r-chip" title="${esc(nameOf(kind,v))}"><span class="inc-chip-text">${esc(nameOf(kind,v))}</span><button type="button" data-ppl-remove="${list}" data-kind="${kind}" data-id="${esc(v)}" aria-label="Remove ${esc(nameOf(kind,v))}">${icon('close',11)}</button></span>`;
 /* patients and employees: tags and the search live in one field */
 const searchCell=(list,kind,f,off)=>{const arr=f[LISTS[list][kind]],noun=kind==='patient'?'patients':'employees';
  return `<div class="r-searchwrap"><div class="r-person-combobox${off?' is-disabled':''}" data-fit>${arr.map(v=>chip(list,kind,v)).join('')}<input type="search" id="inc-ppl-${list}-${kind}" data-ppl-search="${list}:${kind}" placeholder="${arr.length?'Add more':'Search '+noun}" aria-label="Search ${noun} by name or ID" aria-controls="inc-res-${list}-${kind}" aria-expanded="false" autocomplete="off"${off?' disabled':''}></div><div class="r-results" id="inc-res-${list}-${kind}" hidden></div></div>`};
 /* others: the same field. Type a name and press Enter; it becomes a tag. */
 const otherCell=(list,f,off)=>{const arr=f[LISTS[list].other];
  return `<div class="r-searchwrap"><div class="r-person-combobox${off?' is-disabled':''}" data-fit>${arr.map(v=>chip(list,'other',v)).join('')}<input type="text" id="inc-oth-${list}" maxlength="120" data-ppl-other="${list}" placeholder="${arr.length?'Add more':'Type a name, press Enter'}" aria-label="Other person: type a name and press Enter"${off?' disabled':''}></div></div>`};
 const KIND_LABEL={patient:'Patients',employee:'Employees',other:'Others'};
 const peopleBody=(list,f)=>{
  const on=f[onKey(list)],none=Boolean(f[noneKey(list)]),unk=Boolean(f[unkKey(list)]);
  const opt=(attr,type,name,checked,label)=>`<label class="inc-opt"><input type="${type}"${name?` name="${name}"`:''} ${attr}${checked?' checked':''}>${label}</label>`;
  const cell=kind=>on[kind]?ff(list+'-'+kind[0],KIND_LABEL[kind],kind==='other'?otherCell(list,f,false):searchCell(list,kind,f,false),{}):'';
  return `<div class="inc-pp-opts" role="group" aria-label="${list==='affected'?'Affected':'Involved'} people">${['patient','employee','other'].map(k=>opt(`data-ppl-kind="${list}:${k}"`,'checkbox','',Boolean(on[k]),KIND_LABEL[k])).join('')}<span class="inc-pp-sep" aria-hidden="true"></span>${opt(`data-ppl-excl="${list}:unknown" value="unknown"`,'radio',`inc-${list}-excl`,unk,'Unknown person')}${opt(`data-ppl-excl="${list}:none" value="none"`,'radio',`inc-${list}-excl`,none,label0(list))}</div>${(!none&&!unk&&(on.patient||on.employee||on.other))?`<div class="inc-pp-cells">${['patient','employee','other'].map(cell).join('')}</div>`:''}`;
 };
 const peopleMeta=(list,f)=>f[noneKey(list)]?label0(list):f[unkKey(list)]?'Unknown person':(count(f,list)?`${count(f,list)} added`:'None added');

 const sec=(key,title,meta,body,o={})=>{const S=rUI.formSecs,open=Boolean(S[key]);
  return `<section class="inc-fsec" data-sec="${key}"><button type="button" class="inc-fsec-head" data-inc-sec="${key}" aria-expanded="${open}" aria-controls="inc-sec-${key}">${chev}<h3>${title}</h3><span class="inc-fsec-meta${o.warn?' warn':''}">${meta}</span></button><div class="inc-fsec-body" id="inc-sec-${key}"${open?'':' hidden'}>${body}</div></section>`};

 /* Dropdown with a colour dot inside the field and beside each option. */
 const csel=(key,opts,value)=>{
  const cur=opts.find(o=>o.v===value)||opts[0];
  return `<div class="csel" data-csel="${key}"><button type="button" class="csel-btn" id="inc-${key}" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="inc-lbl-${key} inc-${key}-val"><span class="csel-dot" style="background:${esc(cur.color)}" aria-hidden="true"></span><span class="csel-val" id="inc-${key}-val">${esc(cur.label)}</span>${chev}</button><ul class="csel-list" role="listbox" tabindex="-1" aria-labelledby="inc-lbl-${key}" hidden>${opts.map(o=>`<li role="option" id="inc-${key}-o-${o.v||'none'}" data-v="${esc(o.v)}" aria-selected="${o.v===cur.v}"><span class="csel-dot" style="background:${esc(o.color)}" aria-hidden="true"></span><span>${esc(o.label)}</span></li>`).join('')}</ul></div>`;
 };
 /* The action bar sits under the scrolling form, inside the panel, so it never scrolls away. */
 const rpDrawerWithBar=rpDrawerContents;
 rpDrawerContents=function(){
  const html=rpDrawerWithBar(),m=html.match(/<footer class="r-formfooter">[\s\S]*?<\/footer>/);
  if(!m)return html;
  const bar=m[0].replace('class="r-formfooter"','class="r-formfooter rp-bar"');
  return html.replace(m[0],'').replace(/<\/div><\/div><\/section>\s*$/,`</div></div>${bar}</section>`);
 };
 rFormView=function(){
  const f=rUI.form;ensure(f);
  if(rUI.formSecsFor!==f){rUI.formSecs={details:true,affected:true,involved:false,other:false};rUI.formSecsFor=f}
  const sevItems=(listBy(store.published.severityList)||{}).items||[];
  const when=f.eventDate?`${f.eventDate}T${f.eventTime||'00:00'}`:'';
  const nowLocal=(()=>{const d=new Date(rNow()),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`})();
  const typeLabel=f.subtype?esc(rShortClass(f)):'Select incident type';
  const errs=rUI.fieldErrors||{},hasErr=Boolean(errs.type||errs.description);
  const done=f.subtype&&String(f.description||'').trim();
  const detailsMeta=hasErr?'Needs attention':(done?'Complete':'Required');
  const files=(f.attachments||[]).length,otherN=[f.injuryDetails,f.responseDetails].filter(x=>String(x||'').trim()).length+(files?1:0);
  const sevOpts=[{v:'',label:'Not sure',color:'#a8b4bf'},...sevItems.map(l=>({v:l.id,label:l.name,color:store.published.colors[l.id]||'#607D70'}))];
  const urgOpts=[{v:'yes',label:'Urgent',color:'#c5424a'},{v:'no',label:'Not urgent',color:'#7a97b3'},{v:'unknown',label:'Not sure',color:'#c3cdd6'}];
  const details=`<div class="inc-row4">
${ff('type','Incident type',`<div class="r-classwrap"><button type="button" class="r-classbutton" data-r="toggle-classification" aria-expanded="false" aria-controls="r-classmenu" title="${f.subtype?esc(rClass(f)):''}"><span>${typeLabel}</span>${icon('down',15)}</button><div class="r-classmenu" id="r-classmenu" hidden><input type="search" id="r-class-search" aria-label="Search incident types" placeholder="Search types"><div class="r-classlist" id="r-classlist">${rClassMenu()}</div></div></div>`,{required:true})}
${ff('severity','Severity',csel('severity',sevOpts,f.severity),{forId:'inc-severity'})}
${ff('urgency','Urgency',csel('urgency',urgOpts,f.urgency),{forId:'inc-urgency'})}
${ff('event','Date and time',`<input id="inc-when" type="datetime-local" value="${esc(when)}" max="${nowLocal}" aria-label="Date and time">`,{forId:'inc-when'})}
</div>
${f.urgency==='yes'?`<div class="note amber inc-urgnote">${icon('warning',16)}<div>Follow your facility’s emergency procedure now. Submitting this report doesn’t call for help.</div></div>`:''}
<div class="inc-desc">${ff('description','Description',rArea('description','','maxlength="6000" rows="5" aria-required="true" id="inc-description"'),{required:true,span:true})}</div>`;
  const other=`<div class="inc-grid">
${ff('injuryDetails','Injury details',rArea('injuryDetails','','maxlength="2500" rows="4" id="inc-injury"'),{help:'Describe any injury. Leave blank if none.'})}
${ff('responseDetails','Response details',rArea('responseDetails','','maxlength="3500" rows="4" id="inc-response"'),{help:'Describe what was done, such as first aid or calling for help. Leave blank if none.'})}
${ff('attachments','Attachments',`<label class="btn small inc-addfiles" for="r-files">${icon('upload',14)} Add files</label><input type="file" id="r-files" multiple hidden accept=".pdf,.png,.jpg,.jpeg,.txt,.docx">${rAttachmentList(f.attachments,'form')}`,{span:true,help:'Up to 10 files: PDF, image, text or Word.'})}
</div>`;
  return `<form id="reporter-form" class="inc-form" novalidate>
${sec('details','Incident details',detailsMeta,details,{warn:hasErr})}
${sec('affected','Affected people',peopleMeta('affected',f),peopleBody('affected',f))}
${sec('involved','Involved people',peopleMeta('involved',f),peopleBody('involved',f))}
${sec('other','Other details',otherN?`${otherN} filled`:'None added',other)}
<footer class="r-formfooter"><span></span><div class="actions"><button type="button" class="btn" data-r="home">Cancel</button><button type="button" class="btn" data-r="save-report-draft">Save draft</button><button type="button" class="btn primary" data-r="review-report">Submit report</button></div></footer>
</form>`;
 };

 /* tags that do not fit fold into "+N"; the full list is in the dropdown */
 function fitChips(){
  document.querySelectorAll('.rp-drawer .r-person-combobox[data-fit]').forEach(box=>{
   box.querySelectorAll('.inc-more').forEach(m=>m.remove());
   const chips=[...box.querySelectorAll('.r-chip')];chips.forEach(c=>{c.hidden=false});
   if(!chips.length||!box.clientWidth)return;
   const input=box.querySelector('input'),cs=getComputedStyle(box),gap=6;
   box.classList.add('measuring');
   const widths=chips.map(c=>c.getBoundingClientRect().width+gap);
   box.classList.remove('measuring');
   const room=box.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-76-46;
   let used=0,shown=0;
   widths.forEach((w,i)=>{if(i===0||used+w<=room){used+=w;shown=i+1}});
   if(shown<chips.length){
    chips.slice(shown).forEach(c=>{c.hidden=true});
    const more=document.createElement('button');more.type='button';more.className='inc-more';more.dataset.pplMore='1';more.textContent=`+${chips.length-shown}`;
    more.title=chips.slice(shown).map(c=>c.title).join(', ');more.setAttribute('aria-label',`${chips.length-shown} more selected. Open the list to review or remove.`);
    box.insertBefore(more,input);
   }
  });
 }
 const baseRender=render;
 render=function(){const r=baseRender.apply(this,arguments);requestAnimationFrame(fitChips);return r};
 window.addEventListener('resize',()=>requestAnimationFrame(fitChips));

 /* required answers, shown under each field */
 window.incFormErrors=function(f){
  ensure(f);const e={};
  if(!f.subtype)e.type='Choose an incident type.';
  if(!String(f.description||'').trim())e.description='Describe what happened, even briefly.';
  return e;
 };
 rReviewReport=function(){
  const f=rUI.form,e=incFormErrors(f);
  if(Object.keys(e).length){
   rUI.fieldErrors=e;rUI.error='';rUI.formSecs.details=true;render();
   const first=document.querySelector('.rp-drawer .inc-ferr');
   if(first){first.scrollIntoView({block:'center'});const c=first.closest('.inc-ff').querySelector('input,select,textarea,button');if(c)c.focus({preventScroll:true})}
   return;
  }
  rUI.fieldErrors={};syncAffected(f);
  if(!f.affectedNone&&!f.affectedUnknown&&!any(f,'affected')&&!f.noAffectedConfirmed){incAsk({msg:'No affected person added. Submit anyway?'}).then(ok=>{if(ok){f.noAffectedConfirmed=true;rReviewReport()}});return}
  f.affectedStash=null;f.involvedStash=null;
  const other=rValidation(f);if(other.length){toast(other[0],true);return}
  rSubmit();
 };
 const clearErr=e=>{const w=e.target.closest&&e.target.closest('.inc-ff');if(!w||!rUI.fieldErrors)return;const k=w.dataset.ff;if(rUI.fieldErrors[k]){delete rUI.fieldErrors[k];w.querySelector('.inc-ferr')?.remove()}};
 document.addEventListener('input',clearErr,true);document.addEventListener('change',clearErr,true);
 /* the Incident details header says Required, Needs attention or Complete, and keeps up as you type */
 const refreshMeta=()=>{const m=document.querySelector('[data-sec=details] .inc-fsec-meta');if(!m)return;const f=rUI.form,ta=document.getElementById('inc-description'),desc=ta?ta.value:f.description,errs=rUI.fieldErrors||{},bad=errs.type||errs.description,done=f.subtype&&String(desc||'').trim();m.textContent=bad?'Needs attention':(done?'Complete':'Required');m.classList.toggle('warn',Boolean(bad))};
 document.addEventListener('input',()=>setTimeout(refreshMeta,0),true);document.addEventListener('change',()=>setTimeout(refreshMeta,0),true);

 /* Tick Patients, Employees or Others to show its search field. Unknown person and No person switch every field off.
    People already added are kept aside and come back if the choice is undone. */
 document.addEventListener('change',e=>{
  const el=e.target;if(!el.dataset||(!el.dataset.pplKind&&!el.dataset.pplExcl))return;e.stopImmediatePropagation();
  const f=rUI.form;ensure(f);
  const toList=a=>({patients:f[LISTS[a].patient],employees:f[LISTS[a].employee],others:f[LISTS[a].other]});
  if(el.dataset.pplKind){
   const [list,kind]=el.dataset.pplKind.split(':'),K=LISTS[list],key=K[kind],on=f[onKey(list)],sk=stashKey(list),st=f.pplStash[list];
   if(f[noneKey(list)]||f[unkKey(list)]){
    f[noneKey(list)]=false;f[unkKey(list)]=false;
    if(f[sk]){const b=f[sk];if(b.patients.length){f[K.patient]=b.patients;on.patient=true}if(b.employees.length){f[K.employee]=b.employees;on.employee=true}if(b.others.length){f[K.other]=b.others;on.other=true}f[sk]=null}
   }
   if(el.checked){on[kind]=true;if(st[kind]&&st[kind].length&&!f[key].length)f[key]=st[kind];st[kind]=null}
   else{if(f[key].length)st[kind]=f[key];f[key]=[];on[kind]=false;if(list==='affected')f.injured=(f.injured||[]).filter(x=>!x.startsWith(kind+':'))}
  }else{
   const [list,which]=el.dataset.pplExcl.split(':'),K=LISTS[list],on=f[onKey(list)],sk=stashKey(list);
   if(any(f,list)&&!f[sk])f[sk]=toList(list);
   f[K.patient]=[];f[K.employee]=[];f[K.other]=[];on.patient=false;on.employee=false;on.other=false;
   f[noneKey(list)]=which==='none';f[unkKey(list)]=which==='unknown';
   if(list==='affected')f.injured=[];
  }
  syncAffected(f);rUI.formDirty=true;render();
 },true);

 /* multi-select search: everyone is listed, chosen people carry a tick, and a click toggles them */
 function showResults(el){
  const [list,kind]=el.dataset.pplSearch.split(':'),f=rUI.form;ensure(f);
  const q=el.value.trim().toLowerCase(),box=document.getElementById(`inc-res-${list}-${kind}`);if(!box)return;
  const have=f[LISTS[list][kind]],items=[];
  if(kind==='patient'){if(rState.patientAccess)PATIENTS.filter(p=>p.allowed&&(!q||(p.name+' '+p.id).toLowerCase().includes(q))).forEach(p=>items.push([p.id,p.name]))}
  else EMPLOYEES.filter(x=>!q||(x.name+' '+x.id).toLowerCase().includes(q)).forEach(x=>items.push([x.id,x.name]));
  box.innerHTML=items.length?items.map(([id,name])=>{const on=have.includes(id);return `<button type="button" class="inc-result${on?' is-on':''}" role="option" aria-selected="${on}" data-ppl-pick="${list}" data-kind="${kind}" data-id="${esc(id)}" title="${esc(name)}">${on?tick:'<span class="inc-tick"></span>'}<strong>${esc(name)}</strong><span class="mono">${esc(id)}</span></button>`}).join(''):`<div class="r-empty" style="padding:12px">No matches.</div>`;
  box.hidden=false;el.setAttribute('aria-expanded','true');
 }
 document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.pplSearch)showResults(e.target)},true);
 document.addEventListener('focusin',e=>{const d=e.target.dataset;if(d&&d.pplSearch){if(rUI.skipOpen===d.pplSearch){rUI.skipOpen=null;return}showResults(e.target)}},true);
 const addOther=(list,keepFocus)=>{
  const f=rUI.form,input=document.getElementById('inc-oth-'+list);if(!input)return;const v=input.value.replace(/,/g,' ').trim();if(!v)return;ensure(f);
  const arr=f[LISTS[list].other];if(!arr.includes(v))arr.push(v);
  if(list==='affected')syncAffected(f);
  rUI.formDirty=true;render();if(keepFocus)setTimeout(()=>document.getElementById('inc-oth-'+list)?.focus(),0);
 };
 const removeOne=(list,kind,v)=>{const f=rUI.form;ensure(f);const key=LISTS[list][kind];f[key]=f[key].filter(x=>x!==v);if(list==='affected')syncAffected(f);rUI.formDirty=true};
 document.addEventListener('keydown',e=>{
  const d=e.target.dataset;if(!d)return;
  if((e.key==='Enter'||e.key===',')&&d.pplOther){e.preventDefault();addOther(d.pplOther,true)}
  if(e.key==='Escape'&&d.pplSearch){const b=document.getElementById('inc-res-'+d.pplSearch.replace(':','-'));if(b&&!b.hidden){b.hidden=true;e.stopPropagation()}}
  if(e.key==='Backspace'&&(d.pplSearch||d.pplOther)&&!e.target.value){
   const f=rUI.form;ensure(f);const list=(d.pplSearch||d.pplOther).split(':')[0],kind=d.pplSearch?d.pplSearch.split(':')[1]:'other',arr=f[LISTS[list][kind]];
   if(arr.length){e.preventDefault();removeOne(list,kind,arr[arr.length-1]);rUI.skipOpen=d.pplSearch||null;render();setTimeout(()=>document.getElementById(d.pplSearch?`inc-ppl-${list}-${kind}`:`inc-oth-${list}`)?.focus(),0)}
  }
 },true);
 /* a name typed in Others becomes a tag when you leave the field */
 document.addEventListener('focusout',e=>{const d=e.target.dataset;if(d&&d.pplOther&&e.target.value.trim()&&!e.relatedTarget?.closest?.('[data-ppl-remove]'))addOther(d.pplOther,false)},true);
 document.addEventListener('click',e=>{
  const sh=e.target.closest('[data-inc-sec]');
  if(sh){e.preventDefault();e.stopImmediatePropagation();const k=sh.dataset.incSec;rUI.formSecs[k]=!rUI.formSecs[k];sh.setAttribute('aria-expanded',rUI.formSecs[k]?'true':'false');const b=document.getElementById('inc-sec-'+k);if(b)b.hidden=!rUI.formSecs[k];requestAnimationFrame(fitChips);return}
  const more=e.target.closest('[data-ppl-more]');
  if(more){e.preventDefault();e.stopImmediatePropagation();const inp=more.closest('.r-person-combobox').querySelector('input');if(inp)inp.focus();return}
  const d=e.target.dataset;if(d&&d.pplSearch)showResults(e.target);
  const pick=e.target.closest('[data-ppl-pick]');
  if(pick){
   e.preventDefault();e.stopImmediatePropagation();const f=rUI.form,list=pick.dataset.pplPick,kind=pick.dataset.kind,v=pick.dataset.id;ensure(f);
   const key=LISTS[list][kind];
   if(f[key].includes(v))f[key]=f[key].filter(x=>x!==v);else f[key].push(v);
   if(list==='affected')syncAffected(f);
   rUI.formDirty=true;rUI.skipOpen=`${list}:${kind}`;render();setTimeout(()=>document.getElementById(`inc-ppl-${list}-${kind}`)?.focus(),0);return;
  }
  const rm=e.target.closest('[data-ppl-remove]');
  if(rm){
   e.preventDefault();e.stopImmediatePropagation();removeOne(rm.dataset.pplRemove,rm.dataset.kind,rm.dataset.id);render();return;
  }
  if(e.target.closest('[data-r="select-classification"]')&&rUI.fieldErrors)delete rUI.fieldErrors.type;
  if(!e.target.closest('.r-searchwrap'))document.querySelectorAll('.rp-drawer .r-results').forEach(b=>{b.hidden=true});
 },true);

 /* Custom dropdown behaviour: click or keyboard, arrows to move, Enter to choose, Escape to close without closing the form. */
 const cselOpts=w=>[...w.querySelectorAll('[role=option]')];
 function cselClose(w,focusBtn){const b=w.querySelector('.csel-btn'),l=w.querySelector('.csel-list');l.hidden=true;b.setAttribute('aria-expanded','false');l.removeAttribute('aria-activedescendant');if(focusBtn)b.focus({preventScroll:true})}
 function cselActive(w,o){cselOpts(w).forEach(x=>x.classList.toggle('is-active',x===o));w.querySelector('.csel-list').setAttribute('aria-activedescendant',o.id);if(o.scrollIntoView)o.scrollIntoView({block:'nearest'})}
 function cselOpen(w){document.querySelectorAll('.csel').forEach(x=>{if(x!==w)cselClose(x)});const b=w.querySelector('.csel-btn'),l=w.querySelector('.csel-list'),o=cselOpts(w);l.hidden=false;b.setAttribute('aria-expanded','true');cselActive(w,o.find(x=>x.getAttribute('aria-selected')==='true')||o[0]);l.focus({preventScroll:true})}
 function cselPick(w,o){const key=w.dataset.csel;ensure(rUI.form);rUI.form[key]=o.dataset.v;rUI.formDirty=true;render();document.getElementById('inc-'+key)?.focus({preventScroll:true})}
 document.addEventListener('click',e=>{
  const b=e.target.closest('.csel-btn');
  if(b){e.preventDefault();e.stopImmediatePropagation();const w=b.closest('.csel');b.getAttribute('aria-expanded')==='true'?cselClose(w):cselOpen(w);return}
  const o=e.target.closest('.csel [role=option]');
  if(o){e.preventDefault();e.stopImmediatePropagation();cselPick(o.closest('.csel'),o);return}
  document.querySelectorAll('.csel').forEach(w=>{if(!w.contains(e.target))cselClose(w)});
 },true);
 window.addEventListener('keydown',e=>{
  const w=e.target&&e.target.closest?e.target.closest('.csel'):null;if(!w)return;
  const l=w.querySelector('.csel-list'),open=!l.hidden,o=cselOpts(w),i=o.findIndex(x=>x.classList.contains('is-active'));
  if(!open){if(['ArrowDown','ArrowUp','Enter',' '].includes(e.key)&&e.target.classList.contains('csel-btn')){e.preventDefault();e.stopPropagation();cselOpen(w)}return}
  if(e.key==='Escape'){e.preventDefault();e.stopPropagation();cselClose(w,true);return}
  if(e.key==='Tab'){cselClose(w);return}
  if(e.key==='ArrowDown'){e.preventDefault();cselActive(w,o[Math.min(o.length-1,i+1)])}
  else if(e.key==='ArrowUp'){e.preventDefault();cselActive(w,o[Math.max(0,i-1)])}
  else if(e.key==='Home'){e.preventDefault();cselActive(w,o[0])}
  else if(e.key==='End'){e.preventDefault();cselActive(w,o[o.length-1])}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();cselPick(w,o[i]||o[0])}
  else if(e.key.length===1){const ch=e.key.toLowerCase(),n=o.slice(i+1).concat(o.slice(0,i+1)).find(x=>x.textContent.trim().toLowerCase().startsWith(ch));if(n)cselActive(w,n)}
 },true);

 /* one picker for date and time */
 document.addEventListener('change',e=>{
  if(!e.target||e.target.id!=='inc-when')return;e.stopImmediatePropagation();
  const f=rUI.form,v=e.target.value;
  if(v){const [d,t]=v.split('T');f.eventDate=d;f.eventTime=t||''}else{f.eventDate='';f.eventTime=''}
  f.timeUnknown=false;f.approximate=false;rUI.formDirty=true;
 },true);
})();
</script>
</body></html>
